<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Component Detail</title>
<!-- Chart.js v4.5.1 - vendored locally for security (no external CDN dependency) -->
<script src="vendor/chart.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a1929;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
a{color:#5ea7ff;text-decoration:none}a:hover{text-decoration:underline}
.container{max-width:1500px;margin:0 auto;padding:24px 32px}
.back-link{font-size:13px;margin-bottom:8px;display:inline-block}

.header-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:20px}
.header-left h1{font-size:24px;font-weight:700;color:#fff;margin-bottom:4px}
.header-left p{font-size:13px;color:#8899aa;max-width:700px;line-height:1.5}

.filter-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filter-group{display:flex;flex-direction:column;gap:2px}
.filter-label{font-size:9px;text-transform:uppercase;color:#6b8299;letter-spacing:.5px;font-weight:600}
.filter-value{font-size:12px;color:#fff;font-weight:500}
.filter-bar select,.filter-bar input[type="date"]{
  background:#132f4c;color:#fff;border:1px solid #1e4976;border-radius:4px;
  padding:5px 8px;font-size:12px;cursor:pointer;outline:none;min-width:90px;
  appearance:auto;-webkit-appearance:auto;
}
.filter-bar select:hover,.filter-bar input[type="date"]:hover{border-color:#3a6ea5}
.filter-bar input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer}

/* Metric cards */
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}
.mc{border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.mc .mc-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.8;font-weight:600}
.mc .mc-value{font-size:32px;font-weight:700;color:#fff}
.mc-results{background:#132f4c}
.mc-passed{background:#00b894}
.mc-failed{background:#ff4757}
.mc-skipped{background:#132f4c}
.mc-pct{background:rgba(162,155,254,.15);border:1px solid rgba(162,155,254,.3)}

/* Alert bars */
.alerts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.alert-bar{border-radius:6px;padding:12px 18px;border-left:4px solid}
.alert-failed{background:rgba(255,71,87,.1);border-color:#ff4757}
.alert-skipped{background:rgba(255,165,2,.1);border-color:#ffa502}
.alert-bar .alert-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:4px}
.alert-failed .alert-title{color:#ff4757}
.alert-skipped .alert-title{color:#ffa502}
.alert-bar .alert-count{font-size:28px;font-weight:700;color:#fff}
.alert-bar .alert-count a{color:inherit;text-decoration:underline;text-decoration-style:dotted}
.alert-bar .alert-desc{font-size:12px;color:#8899aa;margin-top:2px}

/* Grid layouts */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-bottom:24px}
@media(max-width:1000px){.two-col,.three-col{grid-template-columns:1fr}}

.panel{background:#0d2137;border:1px solid #1e4976;border-radius:8px;padding:20px}
.panel h3{font-size:15px;font-weight:600;color:#fff;margin-bottom:4px}
.panel .panel-sub{font-size:11px;color:#6b8299;margin-bottom:14px}
.panel-full{grid-column:1/-1}

/* Gate heatmap — matches main dashboard style */
.gate-heatmap-wrap{overflow-x:auto;overflow-y:visible;position:relative}
table.gate-hm{width:100%;border-collapse:collapse}
table.gate-hm th,table.gate-hm td{padding:6px 5px;text-align:center;border-bottom:1px solid #1e4976;white-space:nowrap;font-size:11px;position:relative}
table.gate-hm th{color:#6b8299;font-weight:600;position:sticky;top:0;background:#0d2137;z-index:5}
table.gate-hm th:first-child,table.gate-hm td:first-child{text-align:left;min-width:100px;font-weight:500}

.gate-cell{display:inline-block;border-radius:6px;padding:6px 6px 4px;min-width:56px;text-align:center;cursor:pointer;position:relative}
.gc-green{background:rgba(46,213,115,.15);border:1px solid rgba(46,213,115,.3)}
.gc-amber{background:rgba(255,165,2,.12);border:1px solid rgba(255,165,2,.25)}
.gc-orange{background:rgba(225,112,85,.12);border:1px solid rgba(225,112,85,.25)}
.gc-red{background:rgba(255,71,87,.12);border:1px solid rgba(255,71,87,.25)}
.gc-na{color:#4a5568}
.gc-pct{font-size:14px;font-weight:700;line-height:1}
.gc-pct-green{color:#2ed573}.gc-pct-amber{color:#ffa502}.gc-pct-orange{color:#e17055}.gc-pct-red{color:#ff4757}
.gc-runs{font-size:9px;color:#8899aa;margin-top:2px}
.gc-marks{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:3px}
.gate-mark{cursor:pointer;font-size:13px}
.gate-mark-p{color:#2ed573}.gate-mark-f{color:#ff4757}

/* Gate hover dropdown */
.gc-dropdown{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:#132f4c;border:1px solid #1e4976;border-radius:8px;padding:8px 0;z-index:200;
  min-width:280px;max-height:300px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.6);text-align:left}
.gc-dropdown.gc-dd-below{bottom:auto;top:calc(100% + 6px)}
.gate-cell:hover .gc-dropdown{display:block}
.gc-dd-title{padding:6px 14px 4px;font-size:10px;color:#6b8299;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1e4976;margin-bottom:4px}
.gc-dd-run{padding:5px 14px;border-bottom:1px solid rgba(30,73,118,.3)}
.gc-dd-run:last-child{border-bottom:none}
.gc-dd-run a{color:#5ea7ff;font-size:11px}
.gc-dd-state{font-size:10px;font-weight:700;margin-left:auto}

/* Charts */
.chart-container{position:relative;width:100%;height:260px}
.chart-container canvas{width:100%!important;height:100%!important}
.chart-lg{height:300px}

/* TFA legend */
.tfa-legend{margin-top:12px}
.tfa-legend-item{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px;color:#8899aa}
.tfa-legend-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* Version toggles */
.version-toggles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.version-toggles label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:#ccc;
  background:#132f4c;border:1px solid #1e4976;border-radius:4px;padding:4px 10px}
.version-toggles input[type="checkbox"]{accent-color:#5ea7ff}

/* Help box */
.help-box{background:rgba(94,167,255,.06);border:1px solid rgba(94,167,255,.15);border-radius:8px;padding:14px 18px;margin-top:12px}
.help-box h4{font-size:13px;color:#5ea7ff;margin-bottom:6px}
.help-box p,.help-box li{font-size:12px;color:#8899aa;line-height:1.6}
.help-box ul{padding-left:18px;margin-top:4px}

.loading{text-align:center;padding:60px;color:#6b8299;font-size:16px}
.error{text-align:center;padding:60px;color:#ff4757;font-size:15px}

/* Quality Success Ratio Section */
.qsr-container{background:linear-gradient(135deg,#0d2137 0%,#132f4c 100%);border:2px solid #1e4976;border-radius:12px;padding:24px;margin-bottom:24px}
.qsr-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.qsr-title{font-size:18px;font-weight:700;color:#fff}
.qsr-subtitle{font-size:12px;color:#8899aa;margin-top:4px}

.qsr-metrics{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:16px;align-items:stretch;margin-bottom:24px}
@media(max-width:900px){.qsr-metrics{grid-template-columns:1fr;}.qsr-arrow{display:none!important}}

.qsr-card{background:#0a1929;border-radius:12px;padding:24px 20px;text-align:center;border:1px solid #1e4976;position:relative;overflow:hidden}
.qsr-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.qsr-card.exec::before{background:linear-gradient(90deg,#ffa502,#ff7f50)}
.qsr-card.quality::before{background:linear-gradient(90deg,#2ed573,#00b894)}
.qsr-card.coverage::before{background:linear-gradient(90deg,#5ea7ff,#3498db)}
.qsr-card-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#8899aa;font-weight:700;margin-bottom:12px}
.qsr-card-value{font-size:48px;font-weight:800;margin-bottom:8px;line-height:1}
.qsr-card.exec .qsr-card-value{color:#ffa502}
.qsr-card.quality .qsr-card-value{color:#2ed573}
.qsr-card.coverage .qsr-card-value{color:#5ea7ff}
.qsr-card-desc{font-size:12px;color:#8899aa;line-height:1.4;font-weight:500}
.qsr-card-formula{font-size:10px;color:#6b8299;margin-top:12px;font-family:'SF Mono',Monaco,monospace;background:#0d2137;padding:8px 12px;border-radius:6px;display:block;text-align:left}

.qsr-arrow{display:flex;flex-direction:column;justify-content:center;align-items:center;color:#4a5568;font-size:24px;padding:0 8px}
.qsr-arrow-label{font-size:9px;text-transform:uppercase;margin-top:4px;letter-spacing:.5px}

.qsr-bridge{background:#0a1929;border-radius:10px;padding:20px;border:1px solid #1e4976}
.qsr-bridge-title{font-size:13px;font-weight:600;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.qsr-bridge-total{font-size:14px;font-weight:700;color:#ff4757;margin-bottom:12px}
.qsr-tree{margin-left:8px;border-left:2px solid #1e4976;padding-left:16px}
.qsr-tree-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(30,73,118,.3);position:relative}
.qsr-tree-item:last-child{border-bottom:none}
.qsr-tree-item::before{content:'├';position:absolute;left:-20px;color:#1e4976;font-size:14px}
.qsr-tree-item:last-child::before{content:'└'}
.qsr-tree-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.qsr-tree-label{flex:1;font-size:12px;color:#ccc}
.qsr-tree-count{font-size:14px;font-weight:700;min-width:50px;text-align:right;cursor:pointer;padding:2px 6px;border-radius:4px;transition:all .2s}
a.qsr-tree-count{text-decoration:underline;text-underline-offset:2px}
a.qsr-tree-count:hover{background:rgba(94,167,255,.15);text-decoration:underline}
.qsr-tree-pct{font-size:10px;color:#6b8299;min-width:40px;text-align:right}
.qsr-tree-link{font-size:10px;color:#5ea7ff;text-decoration:none}

.qsr-skipped{margin-top:16px;padding-top:16px;border-top:1px solid #1e4976}
.qsr-skipped-title{font-size:12px;color:#ffa502;font-weight:600;margin-bottom:8px}
.qsr-skipped-row{display:flex;align-items:center;gap:8px;font-size:11px;color:#8899aa;padding:4px 0}
.qsr-skipped-row .count{color:#fff;font-weight:600;min-width:30px}

.qsr-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:20px;padding-top:20px;border-top:1px solid #1e4976}
@media(max-width:700px){.qsr-summary{grid-template-columns:1fr}}
.qsr-summary-item{text-align:center;padding:12px;background:#0a1929;border-radius:8px}
.qsr-summary-label{font-size:10px;text-transform:uppercase;color:#6b8299;letter-spacing:.5px;margin-bottom:4px}
.qsr-summary-value{font-size:16px;font-weight:700;color:#fff}
</style>
</head>
<body>
<div class="container" id="main"><div class="loading">Loading…</div></div>

<script>
const $=id=>document.getElementById(id);
let jiraConfig=null;

function getParam(n,fb){return new URLSearchParams(location.search).get(n)||fb}
function formatDate(d){return d.toISOString().slice(0,10)}
function friendlyDate(iso){const d=new Date(iso+'T00:00:00');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getDate()}
function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function passPct(p,t){return t>0?Math.round(p/t*100):0}
function pctColor(pct){if(pct>=95)return'green';if(pct>=80)return'amber';if(pct>=60)return'orange';return'red'}

function currentFilters(){
  const d30=new Date();d30.setDate(d30.getDate()-30);
  return{environment:getParam('environment','RHOAI'),version:getParam('version','All'),release:getParam('release','All'),
    from_date:getParam('from_date',formatDate(d30)),to_date:getParam('to_date',formatDate(new Date())),
    use_date_range:getParam('use_date_range','false'),
    provider:getParam('provider','All'),cluster_type:getParam('cluster_type','All'),gate:getParam('gate','All')};
}
function backUrl(){return'index.html?'+new URLSearchParams(currentFilters())}

function reloadWithFilters(){
  const comp=getParam('component',''),f=currentFilters();
  ['f-ver','f-rel','f-from','f-to'].forEach(id=>{const el=document.getElementById(id);if(el){
    const key=({['f-ver']:'version',['f-rel']:'release',['f-from']:'from_date',['f-to']:'to_date'})[id];
    f[key]=el.value;
  }});
  // Handle date range toggle
  const dateToggle=document.getElementById('f-use-date');
  if(dateToggle) f.use_date_range=dateToggle.checked?'true':'false';
  f.component=comp;
  location.search='?'+new URLSearchParams(f);
}

// --- Load Jira config ---
async function loadJiraConfig(){
  try{const r=await fetch(`data/jira_config.json?_=${Date.now()}`);if(r.ok)jiraConfig=await r.json()}catch(_){}
}

// --- Jira helpers ---
function buildJiraUrl(comp,label,ver,rel){
  if(!jiraConfig)return null;
  const rels=jiraConfig.releases||{};
  let matching=[];
  const keys=Object.keys(rels);
  if(ver!=='All'&&rel!=='All'){const k=`${ver}|${rel}`;if(rels[k])matching=[rels[k]]}
  else if(ver!=='All') keys.filter(k=>k.startsWith(ver+'|')).forEach(k=>matching.push(rels[k]));
  else if(rel!=='All') keys.filter(k=>k.endsWith('|'+rel)).forEach(k=>matching.push(rels[k]));
  else keys.forEach(k=>matching.push(rels[k]));
  if(!matching.length)return null;
  const fvs=new Set();matching.forEach(r=>{fvs.add(`'${r.rhoai_jira_version}'`);fvs.add(`'${r.fix_version}'`)});
  const fvList=Array.from(fvs).join(', ');
  let tc=null;const cm=jiraConfig.component_team_map||{};
  if(cm[comp])tc=cm[comp];else{const lc=comp.toLowerCase();for(const[k,v]of Object.entries(cm)){if(k.toLowerCase().includes(lc)||lc.includes(k.toLowerCase())){tc=v;break}}}
  const proj=matching[0].project||'RHOAIENG';
  let jql=`project = ${proj}`;if(tc)jql+=` AND Team = "${tc}"`;
  jql+=` AND (fixVersion IN (${fvList}) OR affectedVersion IN (${fvList}) OR 'Target Version' IN (${fvList}))`;
  jql+=` AND labels = "${label}"`;
  return`https://issues.redhat.com/issues/?jql=${encodeURIComponent(jql)}`;
}

function getJiraCount(comp,label,ver,rel){
  if(!jiraConfig||!jiraConfig.counts)return null;
  const ck=Object.keys(jiraConfig.counts);
  let mk=[];
  if(ver!=='All'&&rel!=='All')mk=[`${ver}|${rel}`].filter(k=>jiraConfig.counts[k]);
  else if(ver!=='All')mk=ck.filter(k=>k.startsWith(ver+'|'));
  else if(rel!=='All')mk=ck.filter(k=>k.endsWith('|'+rel));
  else mk=ck;
  let total=0,found=false;
  mk.forEach(rk=>{
    const tc=jiraConfig.counts[rk];
    Object.entries(tc).forEach(([c,counts])=>{
      if(c===comp||c.toLowerCase().includes(comp.toLowerCase())||comp.toLowerCase().includes(c.toLowerCase())){
        total+=(label==='test-failed'?counts.failed:counts.skipped)||0;found=true;
      }
    });
  });
  return found?total:null;
}

function getTfaData(comp,ver,rel){
  if(!jiraConfig||!jiraConfig.tfa)return null;
  const tk=Object.keys(jiraConfig.tfa);
  let mk=[];
  if(ver!=='All'&&rel!=='All')mk=[`${ver}|${rel}`].filter(k=>jiraConfig.tfa[k]);
  else if(ver!=='All')mk=tk.filter(k=>k.startsWith(ver+'|'));
  else if(rel!=='All')mk=tk.filter(k=>k.endsWith('|'+rel));
  else mk=tk;

  const merged={tfa:{},classified:0,unclassified:0,status:{},total_failed:0};
  mk.forEach(rk=>{
    const teams=jiraConfig.tfa[rk]||{};
    Object.entries(teams).forEach(([c,data])=>{
      if(c===comp||c.toLowerCase().includes(comp.toLowerCase())||comp.toLowerCase().includes(c.toLowerCase())){
        Object.entries(data.tfa||{}).forEach(([k,v])=>{merged.tfa[k]=(merged.tfa[k]||0)+v});
        merged.classified+=data.classified||0;
        merged.unclassified+=data.unclassified||0;
        merged.total_failed+=data.total_failed||0;
        Object.entries(data.status||{}).forEach(([s,v])=>{merged.status[s]=(merged.status[s]||0)+v});
      }
    });
  });
  return merged.total_failed>0?merged:null;
}

// --- Filter static component data ---
function filterComponentData(data,f){
  const{from_date:from,to_date:to,version:ver,release:rel,use_date_range:useDateRange}=f;
  const applyDateFilter = useDateRange === 'true';
  const d=JSON.parse(JSON.stringify(data));
  
  // When a specific release is selected, use that release's daily data
  let dailySource = d.daily || [];
  if(rel !== 'All' && d.releases) {
    const matchingRelease = d.releases.find(r => r.release === rel);
    if(matchingRelease && matchingRelease.daily) {
      dailySource = matchingRelease.daily;
    }
  }
  
  // Filter by date range ONLY if date range toggle is enabled
  if(applyDateFilter) {
    dailySource = dailySource.filter(x => x.date >= from && x.date <= to);
  }
  d.daily = dailySource;
  
  // Calculate totals from filtered daily data
  let tp=0, tf=0, ts=0, tt=0;
  dailySource.forEach(x => {
    tp += x.passed || 0;
    tf += x.failed || 0;
    ts += x.skipped || 0;
    tt += (x.total || (x.passed||0) + (x.failed||0) + (x.skipped||0));
  });
  d.overall = {total: tt, passed: tp, failed: tf, skipped: ts};
  
  // Filter quality gates by date ONLY if date range toggle is enabled
  if(d.quality_gates && applyDateFilter) {
    Object.keys(d.quality_gates).forEach(g => {
      const days = d.quality_gates[g];
      Object.keys(days).forEach(dt => {
        if(dt < from || dt > to) delete days[dt];
      });
    });
  }
  
  // Filter releases
  if(d.releases) {
    if(rel !== 'All') d.releases = d.releases.filter(r => r.release === rel);
    if(applyDateFilter) {
      d.releases.forEach(r => {
        if(r.daily) r.daily = r.daily.filter(x => x.date >= from && x.date <= to);
      });
    }
  }
  
  return d;
}

// --- Load component ---
async function loadComponent(){
  const main=$('main');
  const comp=getParam('component','');
  if(!comp){main.innerHTML='<div class="error">No component specified. <a href="index.html">Back</a></div>';return}

  try{
    let data;const f=currentFilters();f.component=comp;
    // Load full components JSON and heatmap JSON
    const [r2, r3]=await Promise.all([
      fetch(`data/components.json?_=${Date.now()}`),
      fetch(`data/heatmap.json?_=${Date.now()}`)
    ]);
    if(r2.ok){const all=await r2.json();if(all[comp])data=filterComponentData(all[comp],f)}
    if(!data)throw new Error('No data for "'+comp+'"');
    // Extract this component's by_vr data from heatmap for version chart
    let compHeatmap=null;
    if(r3.ok){const hm=await r3.json();compHeatmap=(hm.components||[]).find(c=>c.component===comp)}
    render(data,comp,compHeatmap);
  }catch(e){main.innerHTML=`<div class="error">Failed: ${e.message}<br><a href="${backUrl()}">Back</a></div>`}
}

// --- Render ---
function render(data,comp,compHeatmap){
  const f=currentFilters();
  
  // Set these EARLY so buildTfaJql works in renderQualitySuccessRatio
  window._currentComp=comp;
  window._currentFilters=f;
  
  const ov=data.overall||{};
  const daily=(data.daily||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const qg=data.quality_gates||{};
  const releases=data.releases||[];
  const pct=passPct(ov.passed||0,ov.total||0);

  const failedUrl=buildJiraUrl(comp,'test-failed',f.version,f.release);
  const skippedUrl=buildJiraUrl(comp,'test-skipped',f.version,f.release);
  const failedCount=getJiraCount(comp,'test-failed',f.version,f.release);
  const skippedCount=getJiraCount(comp,'test-skipped',f.version,f.release);
  const tfaData=getTfaData(comp,f.version,f.release);
  window._tfaData=tfaData;
  const filterLabel=[f.version!=='All'?f.version:'',f.release!=='All'?f.release:''].filter(Boolean).join(' ')||'All releases';

  $('main').innerHTML=`
    <a class="back-link" href="${backUrl()}">← Back to heatmap</a>
    <div class="header-row">
      <div class="header-left">
        <h1>${escHtml(comp)}</h1>
        <p>Deep-dive into quality gates, execution trends, and Jira failure classification for this component.</p>
      </div>
      <div class="filter-bar">
        <div class="filter-group"><span class="filter-label">Environment</span><span class="filter-value">RHOAI</span></div>
        <div class="filter-group"><span class="filter-label">Version</span>
          <select id="f-ver" onchange="reloadWithFilters()">
            <option value="All" ${f.version==='All'?'selected':''}>All</option>
            <option value="2.25" ${f.version==='2.25'?'selected':''}>2.25</option>

// --- Quality Success Ratio (Leadership View) ---
function renderQualitySuccessRatio(ov, tfaData, comp, f) {
  const passed = ov.passed || 0;
  const failed = ov.failed || 0;
  const skipped = ov.skipped || 0;
  const total = ov.total || 0;
  
  // TFA classification breakdown
  const tfa = tfaData?.tfa || {};
  const productBugs = tfa['tfa-product-bug'] || 0;
  const automationBugs = tfa['tfa-automation-bug'] || 0;
  const infraIssues = tfa['tfa-infra-issue'] || 0;
  const envSetup = tfa['tfa-env-setup'] || 0;
  const duplicates = tfa['tfa-duplicate'] || 0;
  const knownIssues = tfa['tfa-known-issue'] || 0;
  const falsePositives = tfa['tfa-false-positive'] || 0;
  const wrongAssignment = tfa['tfa-wrong-assignment'] || 0;
  
  // Aggregate categories
  const infraEnvTotal = infraIssues + envSetup;
  const testDefects = automationBugs + falsePositives + duplicates + wrongAssignment;
  const classifiedTotal = tfaData?.classified || 0;
  const unclassifiedTotal = tfaData?.unclassified || 0;
  const totalFailedJira = tfaData?.total_failed || 0;
  
  // Calculate metrics
  // 1. Raw Execution Success = Passed / (Passed + Failed) × 100
  const rawPassRate = (passed + failed) > 0 ? Math.round(passed / (passed + failed) * 100 * 10) / 10 : 0;
  
  // 2. Final Quality Success = Passed / (Passed + Product Bugs) × 100
  // IMPORTANT: Only valid when ALL failures are classified!
  // If unclassified > 0, we show a RANGE (best case vs worst case)
  const triageComplete = unclassifiedTotal === 0;
  const bestCaseQuality = (passed + productBugs) > 0 ? Math.round(passed / (passed + productBugs) * 100 * 10) / 10 : 100;
  // Worst case: assume all unclassified are product bugs
  const worstCaseProductBugs = productBugs + unclassifiedTotal;
  const worstCaseQuality = (passed + worstCaseProductBugs) > 0 ? Math.round(passed / (passed + worstCaseProductBugs) * 100 * 10) / 10 : 0;
  // Triage percentage
  const triagePct = totalFailedJira > 0 ? Math.round(classifiedTotal / totalFailedJira * 100) : 0;
  
  // 3. Validated Coverage = (Passed + Conclusive Failures) / Total × 100
  // Conclusive = all classified failures (we know what happened)
  const conclusiveResults = passed + classifiedTotal;
  const validatedCoverage = total > 0 ? Math.round(conclusiveResults / total * 100 * 10) / 10 : 0;
  
  // For skipped: try to distinguish "approved" (known-issue, duplicate) vs "unapproved"
  // Note: This is an approximation based on Jira labels; in reality we'd need skipped-specific TFA data
  const approvedSkips = knownIssues + duplicates; // Tests skipped due to known tracked issues
  const unapprovedSkips = Math.max(0, skipped - approvedSkips); // Estimate
  
  // Build JQL URLs
  const productBugUrl = buildTfaJql('tfa-label', 'tfa-product-bug');
  const infraUrl = buildTfaJql('tfa-label', 'tfa-infra-issue');
  const envUrl = buildTfaJql('tfa-label', 'tfa-env-setup');
  const automationUrl = buildTfaJql('tfa-label', 'tfa-automation-bug');
  const knownIssueUrl = buildTfaJql('tfa-label', 'tfa-known-issue');
  const unclassifiedUrl = buildTfaJql('unclassified', null);
  const allFailedUrl = buildTfaJql('all', null);
  // Combined JQL URLs for aggregate categories
  const infraEnvCombinedUrl = buildTfaJql('tfa-labels-or', ['tfa-infra-issue', 'tfa-env-setup']);
  const testDefectsCombinedUrl = buildTfaJql('tfa-labels-or', ['tfa-automation-bug', 'tfa-false-positive', 'tfa-duplicate', 'tfa-wrong-assignment']);
  
  // Don't show if no data
  if (!tfaData || totalFailedJira === 0) {
    return `
      <div class="qsr-container" style="opacity:0.6">
        <div class="qsr-header">
          <div>
            <div class="qsr-title">Quality Success Analysis</div>
            <div class="qsr-subtitle">Release readiness metrics showing execution vs. post-triage quality signals</div>
          </div>
        </div>
        <div style="text-align:center;padding:32px;color:#6b8299">
          <p>No TFA (Test Failure Analysis) data available for this component.</p>
          <p style="font-size:11px;margin-top:8px">Once failures are classified in Jira with TFA labels, this section will show:<br>
          Raw Execution Success → Final Quality Success with full classification breakdown.</p>
        </div>
      </div>`;
  }

  return `
    <div class="qsr-container">
      <div class="qsr-header">
        <div>
          <div class="qsr-title">Quality Success Analysis</div>
          <div class="qsr-subtitle">Release readiness metrics: Execution Signal → Post-Triage Quality Signal</div>
        </div>
        <div style="font-size:10px;color:#6b8299;text-align:right">
          <div>Based on ${totalFailedJira.toLocaleString()} Jira issues</div>
          <div style="margin-top:2px">${classifiedTotal.toLocaleString()} classified · ${unclassifiedTotal.toLocaleString()} pending triage</div>
        </div>
      </div>
      
      <!-- Formula Legend -->
      <div style="background:#0a1929;border:1px solid #1e4976;border-radius:8px;padding:14px 18px;margin-bottom:16px">
        <div style="font-size:11px;font-weight:600;color:#fff;margin-bottom:10px">📐 Formula Variables (Data Sources)</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;font-size:11px">
          <div style="padding:8px;background:#132f4c;border-radius:6px">
            <span style="color:#2ed573;font-weight:700">Passed</span> <span style="color:#6b8299">= ${passed.toLocaleString()}</span><br>
            <span style="color:#8899aa;font-size:10px">Test cases that passed (from Jenkins XML)</span>
          </div>
          <div style="padding:8px;background:#132f4c;border-radius:6px">
            <span style="color:#ff4757;font-weight:700">Failed</span> <span style="color:#6b8299">= ${failed.toLocaleString()}</span><br>
            <span style="color:#8899aa;font-size:10px">Test cases that failed (from Jenkins XML)</span>
          </div>
          <div style="padding:8px;background:#132f4c;border-radius:6px">
            <span style="color:#ffa502;font-weight:700">Skipped</span> <span style="color:#6b8299">= ${skipped.toLocaleString()}</span><br>
            <span style="color:#8899aa;font-size:10px">Test cases not executed (from Jenkins XML)</span>
          </div>
          <div style="padding:8px;background:#132f4c;border-radius:6px">
            <span style="color:#a29bfe;font-weight:700">Total</span> <span style="color:#6b8299">= ${total.toLocaleString()}</span><br>
            <span style="color:#8899aa;font-size:10px">Passed + Failed + Skipped (from Jenkins XML)</span>
          </div>
          <div style="padding:8px;background:#132f4c;border-radius:6px;border-left:3px solid #ff4757">
            <span style="color:#ff4757;font-weight:700">Product Bugs</span> <span style="color:#6b8299">= ${productBugs}</span><br>
            <span style="color:#8899aa;font-size:10px">Jira issues with <code style="background:#1e3a5f;padding:1px 3px;border-radius:2px;font-size:9px">tfa-product-bug</code> label</span>
          </div>
          <div style="padding:8px;background:#132f4c;border-radius:6px;border-left:3px solid #2ed573">
            <span style="color:#2ed573;font-weight:700">Classified</span> <span style="color:#6b8299">= ${classifiedTotal}</span><br>
            <span style="color:#8899aa;font-size:10px">Jira issues with ANY TFA label (triaged)</span>
          </div>
          <div style="padding:8px;background:#132f4c;border-radius:6px;border-left:3px solid #ffa502">
            <span style="color:#ffa502;font-weight:700">Unclassified</span> <span style="color:#6b8299">= ${unclassifiedTotal}</span><br>
            <span style="color:#8899aa;font-size:10px">Jira <code style="background:#1e3a5f;padding:1px 3px;border-radius:2px;font-size:9px">test-failed</code> without TFA label</span>
          </div>
          <div style="padding:8px;background:#132f4c;border-radius:6px;border-left:3px solid #6b8299">
            <span style="color:#6b8299;font-weight:700">Total Jira Failed</span> <span style="color:#6b8299">= ${totalFailedJira}</span><br>
            <span style="color:#8899aa;font-size:10px">All Jira issues with <code style="background:#1e3a5f;padding:1px 3px;border-radius:2px;font-size:9px">test-failed</code> label</span>
          </div>
        </div>
      </div>

      <!-- Three headline metrics -->
      <div class="qsr-metrics">
        <!-- Raw Execution Success -->
        <div class="qsr-card exec">
          <div class="qsr-card-label">Execution Signal</div>
          <div class="qsr-card-value">${rawPassRate}%</div>
          <div class="qsr-card-desc">What Jenkins reported before triage</div>
          <div class="qsr-card-formula">
            <div style="color:#8899aa;margin-bottom:4px">Passed ÷ (Passed + Failed)</div>
            <div>${passed.toLocaleString()} ÷ (${passed.toLocaleString()} + ${failed.toLocaleString()}) = <strong style="color:#ffa502">${rawPassRate}%</strong></div>
          </div>
        </div>
        
        <!-- Arrow: Triage -->
        <div class="qsr-arrow">
          <span>→</span>
          <span class="qsr-arrow-label">Triage</span>
        </div>
        
        <!-- Final Quality Success -->
        <div class="qsr-card quality" style="${!triageComplete?'border-color:#ffa502;':''}">
          <div class="qsr-card-label">Post-Triage Quality${!triageComplete?' <span style="color:#ffa502;font-size:9px;background:rgba(255,165,2,.15);padding:2px 6px;border-radius:4px">⚠ INCOMPLETE</span>':''}</div>
          ${triageComplete ? `
            <div class="qsr-card-value">${bestCaseQuality}%</div>
            <div class="qsr-card-desc">True product health after RCA</div>
            <div class="qsr-card-formula">
              <div style="color:#8899aa;margin-bottom:4px">Passed ÷ (Passed + Product Bugs)</div>
              <div>${passed.toLocaleString()} ÷ (${passed.toLocaleString()} + ${productBugs}) = <strong style="color:#2ed573">${bestCaseQuality}%</strong></div>
            </div>
          ` : `
            <div class="qsr-card-value" style="font-size:32px;color:#ffa502">${worstCaseQuality}% – ${bestCaseQuality}%</div>

            <strong style="color:#ff4757">${productBugs} confirmed product bugs</strong><br>
            ${!triageComplete ? `<strong style="color:#ffa502">${unclassifiedTotal} pending triage</strong>` : `<span style="color:#2ed573">✓ Triage complete</span>`}
          </div>
        </div>
      </div>
      
      <div class="help-box" style="margin-top:16px">
        <h4>Understanding Quality Success Metrics</h4>
        <ul>
          <li><strong>Execution Signal</strong> — What Jenkins/XML originally reported. This is the "raw" pass rate before any human investigation.</li>
          <li><strong>Post-Triage Quality</strong> — The true product quality signal. After triage, infrastructure failures, environment issues, and test automation defects are separated from actual product bugs.
            <ul style="margin-top:4px;color:#ffa502">
              <li><strong>⚠ Important:</strong> This metric is only accurate when ALL failures are triaged. If there are unclassified failures, we show a <em>range</em> (worst case to best case) because we don't know if the pending items are product bugs.</li>
              <li><strong>Range interpretation:</strong> Worst case assumes all unclassified = product bugs. Best case assumes none are.</li>
            </ul>
          </li>
          <li><strong>Validated Coverage</strong> — How much of the test scope produced a conclusive quality signal (either passed, or classified with a known root cause).</li>
          <li><strong>Classification Bridge</strong> — Shows exactly how the ${totalFailedJira} reported failures break down into product vs. non-product issues.</li>
        </ul>
        <p style="margin-top:8px;font-style:italic">Note: Final Quality Success focuses on <em>product readiness</em>. Infra/env/test failures don't become "passes" — they remain visible as non-product failures requiring their own remediation.</p>
        <p style="margin-top:8px;color:#6b8299;font-size:11px"><strong>Data freshness:</strong> TFA counts and Jira status are cached from the last data ingestion. JQL links open live queries against Jira, so counts may differ if issues were updated since the last sync.</p>
      </div>
    </div>`;
}

// --- Gate heatmap ---
function renderGateHeatmap(qg,daily){
  const wrap=document.getElementById('qg-wrap');
  const f=currentFilters();
  const filterDesc=[f.version!=='All'?`Version ${f.version}`:'',f.release!=='All'?f.release:''].filter(Boolean).join(' · ')||'current filter';
  
  // Helper: Detect data format - new format has {passed,failed,skipped,total,executions}
  // Old format has just an array of executions per day
  function getDayData(gateDay){
    if(!gateDay) return null;
    if(Array.isArray(gateDay)){
      let p=0,fl=0,s=0,t=0;
      gateDay.forEach(ex=>{p+=(ex.passed||0);fl+=(ex.failed||0);s+=(ex.skipped||0);t+=(ex.total||0)});
      return {passed:p,failed:fl,skipped:s,total:t,executions:gateDay};
    }
    return gateDay;
  }
  
  // Get dates from quality_gates data (not daily) since daily is filtered by release
  // but quality_gates contains all data with version/release info in jenkins_url
  const gates=Object.keys(qg).sort();
  let allDates=new Set();
  gates.forEach(g=>{
    if(qg[g]) Object.keys(qg[g]).forEach(d=>allDates.add(d));
  });
  
  // Apply date filter if enabled
  const applyDateFilter = f.use_date_range === 'true' || f.use_date_range === true;
  if(applyDateFilter && f.from_date && f.to_date){
    allDates = new Set([...allDates].filter(d => d >= f.from_date && d <= f.to_date));
  }
  
  // Filter by version/release if selected - check jenkins_url in executions
  function filterByVersionRelease(dayData){
    if(!dayData || !dayData.executions || dayData.executions.length === 0) return dayData;
    
    // When both filters are "All", return all data
    if(f.version === 'All' && f.release === 'All') return dayData;
    
    const filtered = dayData.executions.filter(ex => {
      if(!ex.jenkins_url) return true; // Keep if no URL to check
      const url = ex.jenkins_url.toLowerCase();
      let matchVer = true, matchRel = true;
      
      // Version filter: match /3.5/ or /3.5- or /3.6/ or /3.6-
      if(f.version !== 'All'){
        const ver = f.version.toLowerCase();
        matchVer = url.includes(`/${ver}/`) || url.includes(`/${ver}-`);
      }
      
      // Release filter: EA1, EA2, GA (case-insensitive)
      // When release is "All", include all releases (EA1, EA2, GA)
      if(f.release !== 'All'){
        const relLower = f.release.toLowerCase();
        if(relLower === 'ga'){
          // GA = version without -ea suffix (e.g., /3.5/ not /3.5-ea.1/)
          matchRel = !url.includes('-ea.');
        } else if(relLower.startsWith('ea')){
          // EA1 -> -ea.1, EA2 -> -ea.2
          const eaNum = relLower.replace('ea', '');
          matchRel = url.includes(`-ea.${eaNum}`);
        } else {
          // Unknown release format - include it
          matchRel = true;
        }
      }
      // When f.release === 'All', matchRel stays true (include EA1 + EA2 + GA)
      
      return matchVer && matchRel;
    });
    
    if(filtered.length === 0) return null;
    
    // Recalculate totals from filtered executions
    let p=0,fl=0,s=0,t=0;
    filtered.forEach(ex=>{p+=(ex.passed||0);fl+=(ex.failed||0);s+=(ex.skipped||0);t+=(ex.total||0)});
    return {passed:p,failed:fl,skipped:s,total:t,executions:filtered};
  }
  
  // Build filtered quality gates data
  const filteredQg = {};
  let hasData = false;
  gates.forEach(g => {
    filteredQg[g] = {};
    [...allDates].forEach(d => {
      if(qg[g] && qg[g][d]){
        const dayData = getDayData(qg[g][d]);
        const filtered = filterByVersionRelease(dayData);
        if(filtered && filtered.total > 0){
          filteredQg[g][d] = filtered;
          hasData = true;
        }
      }
    });
  });
  
  const dates=[...allDates].sort((a,b)=>b.localeCompare(a));
  
  if(!gates.length||!hasData){
    wrap.innerHTML=`
      <div style="background:rgba(255,165,2,0.08);border:1px solid rgba(255,165,2,0.25);border-radius:8px;padding:24px;text-align:center;margin:12px 0">
        <div style="font-size:32px;margin-bottom:12px">📋</div>
        <div style="font-size:15px;font-weight:600;color:#ffa502;margin-bottom:8px">No Quality Gate Data</div>
        <div style="font-size:13px;color:#8899aa">No test executions found for <strong>${filterDesc}</strong>.</div>
        <div style="font-size:12px;color:#6b8299;margin-top:8px">Try selecting a different version, release, or date range.</div>
      </div>`;
    return;
  }
  
  // Use filtered data for rendering
  const qgData = filteredQg;

  let html='<table class="gate-hm"><thead><tr><th>Gate</th>';
  dates.forEach(d=>html+=`<th><div style="display:flex;flex-direction:column;align-items:center;gap:1px"><span>${friendlyDate(d)}</span></div></th>`);
  html+='</tr></thead><tbody>';

  gates.forEach((g,gIdx)=>{
    // Gate-level aggregate (test-level counts) from filtered data
    let gateP=0,gateF=0,gateS=0,gateT=0;
    dates.forEach(d=>{const dd=qgData[g]&&qgData[g][d];if(dd){gateP+=dd.passed;gateF+=dd.failed;gateS+=dd.skipped;gateT+=dd.total}});
    const gatePct=passPct(gateP,gateT);
    const gateCol=pctColor(gatePct);

    html+=`<tr><td style="color:#${gateCol==='green'?'2ed573':gateCol==='amber'?'ffa502':gateCol==='orange'?'e17055':'ff4757'};font-weight:600">${escHtml(g)}<div style="font-size:9px;color:#6b8299">${gatePct}% · ${gateT.toLocaleString()} tests</div></td>`;

    // For top rows, dropdown opens below
    const ddClass=gIdx<2?'gc-dropdown gc-dd-below':'gc-dropdown';

    dates.forEach(d=>{
      const dd=qgData[g]&&qgData[g][d];
      if(!dd||!dd.total){html+='<td><span class="gc-na">–</span></td>';return}

      const pct=passPct(dd.passed,dd.total);
      const col=pctColor(pct);
      const execs=dd.executions||[];

      // Hover dropdown with per-run details
      let dropdown=`<div class="${ddClass}">`;
      dropdown+=`<div class="gc-dd-title">${escHtml(g)} · ${friendlyDate(d)} · ${execs.length} run${execs.length!==1?'s':''}</div>`;
      execs.forEach(ex=>{
        const exPct=ex.total>0?Math.round((ex.passed||0)/ex.total*100):0;
        const stateCol=ex.state==='PASSED'?'#2ed573':'#ff4757';
        const label=ex.jenkins_url?ex.jenkins_url.replace('https://jenkins-csb-rhods-opendatascience.dno.corp.redhat.com/job/','').replace(/\/$/,'').replace(/\/job\//g,'/'):'Run';
        dropdown+=`<div class="gc-dd-run" style="display:flex;justify-content:space-between;align-items:center;gap:8px">`;
        dropdown+=ex.jenkins_url?`<a href="${ex.jenkins_url}" target="_blank" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${label}</a>`:`<span style="flex:1">${label}</span>`;
        dropdown+=`<span style="white-space:nowrap;font-size:10px"><span style="color:#2ed573">${ex.passed||0}P</span> <span style="color:#ff4757">${ex.failed||0}F</span> <span style="color:#ffa502">${ex.skipped||0}S</span></span>`;
        dropdown+=`<span class="gc-dd-state" style="color:${stateCol}">${exPct}%</span></div>`;
      });
      dropdown+='</div>';

      html+=`<td><div class="gate-cell gc-${col}">
        <div class="gc-pct gc-pct-${col}">${pct}%</div>
        <div class="gc-runs" style="display:flex;gap:4px;justify-content:center;font-size:9px;font-weight:600;margin-top:2px"><span style="color:#2ed573">${dd.passed}P</span><span style="color:#ff4757">${dd.failed}F</span><span style="color:#ffa502">${dd.skipped}S</span></div>
        ${dropdown}</div></td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  wrap.innerHTML=html;
}

// --- Version trend chart (groups by version, combines all releases EA1+EA2+GA) ---
let relChart=null;

function renderVersionChart(compHeatmap,filters){
  const toggles=document.getElementById('ver-toggles');
  const chartCanvas=document.getElementById('chart-releases');
  if(!compHeatmap||!compHeatmap.days){
    toggles.innerHTML='';
    if(chartCanvas&&chartCanvas.parentElement){
      chartCanvas.parentElement.innerHTML=`
        <div style="background:rgba(107,130,153,0.1);border:1px solid rgba(107,130,153,0.2);border-radius:8px;padding:24px;text-align:center">
          <div style="font-size:28px;margin-bottom:8px">📈</div>
          <div style="font-size:14px;color:#8899aa">No version trend data available for the selected filter.</div>
        </div>`;
    }
    return;
  }

  // Build version→date→{p,f,s} from by_vr keys
  const verDayMap={}; // "3.5" → { "2026-09-10": {p,f,s} }
  const versions=new Set();
  const {from_date:from,to_date:to}=filters;

  Object.entries(compHeatmap.days).forEach(([date,day])=>{
    if(date<from||date>to) return;
    if(!day.by_vr) return;
    Object.entries(day.by_vr).forEach(([vrKey,vr])=>{
      // Normalize version: "3.5.1|GA" → "3.5", "3.6-ea.1|EA1" → "3.6"
      const rawVer=vrKey.split('|')[0].split('-')[0];
      const vp=rawVer.split('.');const ver=vp.length>=2?vp[0]+'.'+vp[1]:rawVer;
      versions.add(ver);
      if(!verDayMap[ver])verDayMap[ver]={};
      if(!verDayMap[ver][date])verDayMap[ver][date]={p:0,f:0,s:0};
      verDayMap[ver][date].p+=(vr.passed||0);
      verDayMap[ver][date].f+=(vr.failed||0);
      verDayMap[ver][date].s+=(vr.skipped||0);
    });
  });

  if(!versions.size){
    toggles.innerHTML='';
    const chartCanvas2=document.getElementById('chart-releases');
    if(chartCanvas2&&chartCanvas2.parentElement){
      chartCanvas2.parentElement.innerHTML=`
        <div style="background:rgba(107,130,153,0.1);border:1px solid rgba(107,130,153,0.2);border-radius:8px;padding:24px;text-align:center">
          <div style="font-size:28px;margin-bottom:8px">📈</div>
          <div style="font-size:14px;color:#8899aa">No version data for this date range.</div>
        </div>`;
    }
    return;
  }

  const sortedVer=Array.from(versions).sort();
  toggles.innerHTML=sortedVer.map(v=>`<label><input type="checkbox" value="${v}" checked onchange="updateVersionChart()"> ${v}</label>`).join('');
  window._verDayMap=verDayMap;
  updateVersionChart();
}

function updateVersionChart(){
  const verDayMap=window._verDayMap||{};
  const checked=Array.from(document.querySelectorAll('#ver-toggles input:checked')).map(i=>i.value);

  const allDates=new Set();
  checked.forEach(v=>{if(verDayMap[v])Object.keys(verDayMap[v]).forEach(d=>allDates.add(d))});
  const dates=Array.from(allDates).sort();
  const labels=dates.map(friendlyDate);

  const colors=['#2ed573','#3498db','#e17055','#a29bfe','#fdcb6e','#6c5ce7','#00cec9','#fab1a0'];
  const datasets=[];let ci=0;
  checked.forEach(ver=>{
    const dm=verDayMap[ver]||{};
    const c=colors[ci%colors.length];ci++;
    datasets.push({
      label:`${ver} (passed)`,
      data:dates.map(d=>(dm[d]||{}).p||0),
      borderColor:c, backgroundColor:c+'22', tension:.3, fill:false, pointRadius:3, borderWidth:2
    });
  });

  const ctx=document.getElementById('chart-releases').getContext('2d');
  if(relChart)relChart.destroy();
  relChart=new Chart(ctx,{
    type:'line',data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{color:'#8899aa',usePointStyle:true,pointStyle:'rect',padding:14,font:{size:11}}}},
      scales:{x:{ticks:{color:'#6b8299',font:{size:10}},grid:{color:'rgba(30,73,118,.2)'}},
        y:{ticks:{color:'#6b8299',font:{size:10}},grid:{color:'rgba(30,73,118,.3)'},beginAtZero:true}}
    }
  });
}

const TFA_COLORS={
  'tfa-product-bug':'#ff4757','tfa-automation-bug':'#ffa502','tfa-infra-issue':'#3498db',
  'tfa-env-setup':'#a29bfe','tfa-duplicate':'#6b8299','tfa-known-issue':'#fdcb6e',
  'tfa-false-positive':'#2ed573','tfa-wrong-assignment':'#e17055'
};
const TFA_NAMES={
  'tfa-product-bug':'Product Bug','tfa-automation-bug':'Automation Bug','tfa-infra-issue':'Infra Issue',
  'tfa-env-setup':'Env Setup','tfa-duplicate':'Duplicate','tfa-known-issue':'Known Issue',
  'tfa-false-positive':'False Positive','tfa-wrong-assignment':'Wrong Assignment'
};
const TFA_DESC={
  'tfa-product-bug':'Real product issue found by the test',
  'tfa-automation-bug':'Test code issue or flaky automation',
  'tfa-infra-issue':'Infrastructure instability or defect',
  'tfa-env-setup':'Environment setup issue (e.g., missing dependency)',
  'tfa-duplicate':'Same root cause as another tracked issue',
  'tfa-known-issue':'Failure matches an already known and tracked issue',
  'tfa-false-positive':'Passed on re-run, non-reproducible',
  'tfa-wrong-assignment':'Failure initially routed to wrong component'
};

// Build JQL for a specific TFA label (or 'unclassified' / 'all-test-failed' / status:XYZ)
// Status name mapping: our data name -> Jira JQL status name(s)
// Some Jira workflows use different names, so we map to handle both
const STATUS_JQL_MAP = {
  'New': 'New',           // Could also be "Open" in some workflows
  'Open': 'Open',
  'Backlog': 'Backlog',
  'In Progress': 'In Progress',
  'Review': 'Review',
  'Testing': 'Testing',
  'Resolved': 'Resolved',
  'Closed': 'Closed',
  'Done': 'Done'
};

function buildTfaJql(type,value){
  const comp=window._currentComp;
  const f=window._currentFilters;
  if(!comp||!f||!jiraConfig)return null;
  const rels=jiraConfig.releases||{};
  let matching=[];const rk=Object.keys(rels);
  if(f.version!=='All'&&f.release!=='All')matching=[rels[`${f.version}|${f.release}`]].filter(Boolean);
  else if(f.version!=='All')rk.filter(k=>k.startsWith(f.version+'|')).forEach(k=>matching.push(rels[k]));
  else if(f.release!=='All')rk.filter(k=>k.endsWith('|'+f.release)).forEach(k=>matching.push(rels[k]));
  else rk.forEach(k=>matching.push(rels[k]));
  if(!matching.length)return null;
  const fvs=new Set();matching.forEach(r=>{fvs.add(`'${r.rhoai_jira_version}'`);fvs.add(`'${r.fix_version}'`)});
  const fvList=Array.from(fvs).join(', ');
  const cm=jiraConfig.component_team_map||{};
  let tc=null;
  if(cm[comp])tc=cm[comp];else{const lc=comp.toLowerCase();for(const[k,v]of Object.entries(cm)){if(k.toLowerCase().includes(lc)||lc.includes(k.toLowerCase())){tc=v;break}}}
  const proj=matching[0].project||'RHOAIENG';
  let jql=`project = ${proj}`;if(tc)jql+=` AND Team = "${tc}"`;
  jql+=` AND (fixVersion IN (${fvList}) OR affectedVersion IN (${fvList}) OR 'Target Version' IN (${fvList}))`;
  jql+=` AND labels = "test-failed"`;
  const allTfaLabels='"tfa-product-bug","tfa-automation-bug","tfa-infra-issue","tfa-env-setup","tfa-duplicate","tfa-known-issue","tfa-false-positive","tfa-wrong-assignment"';
  if(type==='tfa-label')jql+=` AND labels = "${value}"`;
  else if(type==='tfa-labels-or' && Array.isArray(value)){
    // Multiple labels with OR - e.g., tfa-infra-issue OR tfa-env-setup
    const labelList=value.map(l=>`"${l}"`).join(',');
    jql+=` AND labels IN (${labelList})`;
  }
  else if(type==='classified')jql+=` AND labels IN (${allTfaLabels})`;
  else if(type==='unclassified')jql+=` AND labels NOT IN (${allTfaLabels})`;
  else if(type==='status'){
    // Use mapped status name for JQL
    const jqlStatus = STATUS_JQL_MAP[value] || value;
    jql+=` AND status = "${jqlStatus}"`;
  }
  return`https://issues.redhat.com/issues/?jql=${encodeURIComponent(jql)}`;
}

function renderTfaCharts(tfa){
  // All TFA label keys in order
  const allLabels=Object.keys(TFA_NAMES);

  // 1. Pie chart — TFA label distribution (clickable)
  const tfaEntries=Object.entries(tfa.tfa||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const pieCanvas=document.getElementById('chart-tfa-pie');
  const legend=document.getElementById('tfa-legend');
  
  if(tfaEntries.length>0){
    const pieCtx=pieCanvas.getContext('2d');
    const pieChart=new Chart(pieCtx,{
      type:'doughnut',
      data:{
        labels:tfaEntries.map(([k])=>TFA_NAMES[k]||k),
        datasets:[{data:tfaEntries.map(([,v])=>v),backgroundColor:tfaEntries.map(([k])=>TFA_COLORS[k]||'#6b8299'),borderColor:'#0d2137',borderWidth:2}]
      },
      options:{responsive:true,maintainAspectRatio:false,
        onClick:(evt,elems)=>{
          if(elems.length>0){const idx=elems[0].index;const label=tfaEntries[idx][0];const url=buildTfaJql('tfa-label',label);if(url)window.open(url,'_blank')}
        },
        onHover:(evt,elems)=>{pieCanvas.style.cursor=elems.length>0?'pointer':'default'},
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.raw} issues — click to view in Jira`}}}}
    });
    // Legend (clickable)
    legend.innerHTML=tfaEntries.map(([k,v])=>{
      const url=buildTfaJql('tfa-label',k);
      const link=url?`<a href="${url}" target="_blank" style="color:inherit;text-decoration:none" title="View in Jira">`:'';
      const linkEnd=url?'</a>':'';
      return`<div class="tfa-legend-item" style="cursor:${url?'pointer':'default'}">${link}<span class="dot" style="background:${TFA_COLORS[k]||'#6b8299'}"></span><strong>${TFA_NAMES[k]||k}</strong> (${v}) — ${TFA_DESC[k]||''} <span style="font-size:10px;color:#5ea7ff">↗</span>${linkEnd}</div>`;
    }).join('');
  } else {
    // No classification data - show message
    pieCanvas.parentElement.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:#6b8299;text-align:center">
        <div style="font-size:48px;opacity:0.3;margin-bottom:12px">📊</div>
        <div style="font-size:13px;font-weight:600;color:#8899aa">No Classification Data</div>
        <div style="font-size:11px;margin-top:4px">No failures have been classified with TFA labels yet.</div>
        <div style="font-size:10px;margin-top:8px;color:#ffa502">All ${tfa.total_failed||0} failures are pending triage.</div>
      </div>`;
    legend.innerHTML = '';
  }

  // 2. Status bar chart (clickable)
  const statusCanvas=document.getElementById('chart-status-bar');
  const statusCtx=statusCanvas.getContext('2d');
  
  // Define standard workflow statuses in logical order
  const standardStatuses = ['New', 'Backlog', 'In Progress', 'Review', 'Testing', 'Resolved', 'Closed'];
  
  // Comprehensive status color mapping for Jira
  const statusColors={
    // Open/New states (red)
    'Open':'#ff4757','New':'#ff4757','Reopened':'#ff4757','To Do':'#ff4757',
    // Backlog (gray)
    'Backlog':'#6b8299','Deferred':'#6b8299',
    // In Progress states (amber/orange)
    'In Progress':'#ffa502','In Development':'#ffa502',
    // Review/Testing states (blue)
    'Review':'#3498db','In Review':'#3498db','Code Review':'#3498db',
    'Testing':'#9b59b6','QA':'#9b59b6','Validation':'#9b59b6',
    // Done/Closed states (green)
    'Resolved':'#00b894','Closed':'#2ed573','Done':'#2ed573','Complete':'#2ed573',
    'Verified':'#00b894','Released':'#00b894','Won\'t Do':'#6b8299','Won\'t Fix':'#6b8299'
  };
  
  // Build status data: use standard order, include all statuses even if 0
  const rawStatus = tfa.status || {};
  const statusData = standardStatuses.map(s => ({
    status: s,
    count: rawStatus[s] || 0,
    color: statusColors[s] || '#6b8299'
  }));
  
  // Also add any statuses not in standard list
  Object.keys(rawStatus).forEach(s => {
    if (!standardStatuses.includes(s)) {
      statusData.push({ status: s, count: rawStatus[s], color: statusColors[s] || '#6b8299' });
    }
  });
  
  // Calculate status sum for consistency check
  const statusSum = Object.values(rawStatus).reduce((sum, v) => sum + v, 0);
  const expectedTotal = tfa.total_failed || 0;
  const hasDiscrepancy = statusSum !== expectedTotal && statusSum > 0;
  
  new Chart(statusCtx,{
    type:'bar',
    data:{
      labels: statusData.map(d => d.status),
      datasets:[{
        label:'Issues',
        data: statusData.map(d => d.count),
        backgroundColor: statusData.map(d => d.color),
        borderRadius:4
      }]
    },
    options:{responsive:true,maintainAspectRatio:false,
      onClick:(evt,elems)=>{
        if(elems.length>0){
          const idx=elems[0].index;
          const status=statusData[idx].status;
          const url=buildTfaJql('status',status);
          if(url)window.open(url,'_blank');
        }
      },
      onHover:(evt,elems)=>{statusCanvas.style.cursor=elems.length>0?'pointer':'default'},
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.raw} issues — click to view in Jira`}}
      },
      scales:{
        x:{ticks:{color:'#ccc',font:{size:10}},grid:{color:'rgba(30,73,118,.2)'}},
        y:{ticks:{color:'#6b8299',font:{size:10},stepSize:1},grid:{color:'rgba(30,73,118,.3)'},beginAtZero:true}
      }
    }
  });
  
  // Add sync note with filter info
  const syncNote = document.getElementById('status-sync-note');
  const f = window._currentFilters || {};
  const filterInfo = [f.version !== 'All' ? f.version : '', f.release !== 'All' ? f.release : ''].filter(Boolean).join(' ') || 'All releases';
  
  if(syncNote) {
    let noteHtml = `<span style="color:#6b8299">✓ Status totals: ${statusSum} issues for ${filterInfo}.</span>`;
    if(hasDiscrepancy) {
      noteHtml = `<span style="color:#ffa502">⚠ Chart shows ${statusSum} issues (by status), total_failed = ${expectedTotal}.</span>`;
    }
    noteHtml += `<br><span style="color:#6b8299;font-size:9px">Click bars to view live JQL in Jira. Live counts may differ from cached data if issues were updated since last sync.</span>`;
    syncNote.innerHTML = noteHtml;
  }
}

// --- TFA Date Range Refresh ---
function refreshTfaData(){
  const comp=window._currentComp;
  const f=window._currentFilters;
  if(!comp){console.error('refreshTfaData: no component set');return}
  if(!f){console.error('refreshTfaData: no filters set');return}
  if(!jiraConfig){console.error('refreshTfaData: jiraConfig not loaded');alert('Jira config not loaded. Please wait for data to load.');return}

  const tfaFrom=document.getElementById('tfa-from').value;
  const tfaTo=document.getElementById('tfa-to').value;

  // Build JQL with creation date filter for each TFA chart
  const rels=jiraConfig.releases||{};
  let matchingRels=[];
  const rk=Object.keys(rels);
  if(f.version!=='All'&&f.release!=='All')matchingRels=[rels[`${f.version}|${f.release}`]].filter(Boolean);
  else if(f.version!=='All')rk.filter(k=>k.startsWith(f.version+'|')).forEach(k=>matchingRels.push(rels[k]));
  else if(f.release!=='All')rk.filter(k=>k.endsWith('|'+f.release)).forEach(k=>matchingRels.push(rels[k]));
  else rk.forEach(k=>matchingRels.push(rels[k]));

  if(!matchingRels.length){alert('No matching release found in jira_config.');return}
  const fvs=new Set();matchingRels.forEach(r=>{fvs.add(`'${r.rhoai_jira_version}'`);fvs.add(`'${r.fix_version}'`)});
  const fvList=Array.from(fvs).join(', ');
  const cm=jiraConfig.component_team_map||{};
  let tc=null;
  if(cm[comp])tc=cm[comp];else{const lc=comp.toLowerCase();for(const[k,v]of Object.entries(cm)){if(k.toLowerCase().includes(lc)||lc.includes(k.toLowerCase())){tc=v;break}}}
  const proj=matchingRels[0].project||'RHOAIENG';

  let baseJql=`project = ${proj}`;
  if(tc)baseJql+=` AND Team = "${tc}"`;
  baseJql+=` AND (fixVersion IN (${fvList}) OR affectedVersion IN (${fvList}) OR 'Target Version' IN (${fvList}))`;
  baseJql+=` AND labels = "test-failed"`;
  if(tfaFrom)baseJql+=` AND created >= "${tfaFrom}"`;
  if(tfaTo)baseJql+=` AND created <= "${tfaTo}"`;

  const filterLabel=[f.version!=='All'?f.version:'',f.release!=='All'?f.release:''].filter(Boolean).join(' ')||'All releases';
  const dateLabel=`${friendlyDate(tfaFrom)} – ${friendlyDate(tfaTo)}`;

  // Build links for each TFA label
  const links=[];
  Object.keys(TFA_NAMES).forEach(label=>{
    const jql=baseJql+` AND labels = "${label}"`;
    const url=`https://issues.redhat.com/issues/?jql=${encodeURIComponent(jql)}`;
    links.push({label,name:TFA_NAMES[label],url,jql});
  });
  const allUrl=`https://issues.redhat.com/issues/?jql=${encodeURIComponent(baseJql)}`;
  const classifiedJql=baseJql+' AND labels in ("tfa-product-bug","tfa-automation-bug","tfa-infra-issue","tfa-env-setup","tfa-duplicate","tfa-known-issue","tfa-false-positive","tfa-wrong-assignment")';
  const unclassifiedJql=baseJql+' AND labels NOT IN ("tfa-product-bug","tfa-automation-bug","tfa-infra-issue","tfa-env-setup","tfa-duplicate","tfa-known-issue","tfa-false-positive","tfa-wrong-assignment")';

  // Get TFA data for this component (from window scope, set in loadComponent)
  const tfa=window._tfaData||{total_failed:0,classified:0,unclassified:0,tfa:{},status:{}};
  const triagePct=tfa.total_failed>0?Math.round(tfa.classified/tfa.total_failed*100):0;
  const progressCol=triagePct>=80?'#2ed573':triagePct>=50?'#ffa502':'#ff4757';

  // Update the top progress bar to reflect the date range context
  const pw=document.getElementById('tfa-progress-wrap');
  pw.innerHTML=`
    <h4 style="color:#fff;margin-bottom:10px">Triage Progress: ${escHtml(filterLabel)} · ${dateLabel}</h4>
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">
      <div style="flex:1;background:#1e4976;border-radius:6px;height:28px;overflow:hidden;position:relative">
        <div style="background:${progressCol};height:100%;width:${triagePct}%;border-radius:6px;transition:width .5s"></div>
        <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)">${triagePct}% Triaged</span>
      </div>
      <span style="font-size:20px;font-weight:700;color:${progressCol}">${tfa.classified} / ${tfa.total_failed}</span>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <a href="${allUrl}" target="_blank" style="text-decoration:none;background:#132f4c;border-left:4px solid #ff4757;border-radius:6px;padding:8px 14px;flex:1;min-width:100px">
        <div style="font-size:10px;text-transform:uppercase;color:#6b8299;letter-spacing:.5px">Total Failed</div>
        <div style="font-size:20px;font-weight:700;color:#ff4757">${tfa.total_failed}</div></a>
      <a href="https://issues.redhat.com/issues/?jql=${encodeURIComponent(classifiedJql)}" target="_blank" style="text-decoration:none;background:#132f4c;border-left:4px solid #2ed573;border-radius:6px;padding:8px 14px;flex:1;min-width:100px">
        <div style="font-size:10px;text-transform:uppercase;color:#6b8299;letter-spacing:.5px">Classified</div>
        <div style="font-size:20px;font-weight:700;color:#2ed573">${tfa.classified}</div></a>
      <a href="https://issues.redhat.com/issues/?jql=${encodeURIComponent(unclassifiedJql)}" target="_blank" style="text-decoration:none;background:#132f4c;border-left:4px solid #ffa502;border-radius:6px;padding:8px 14px;flex:1;min-width:100px">
        <div style="font-size:10px;text-transform:uppercase;color:#6b8299;letter-spacing:.5px">Unclassified</div>
        <div style="font-size:20px;font-weight:700;color:#ffa502">${tfa.unclassified}</div></a>
      <div style="background:#132f4c;border-left:4px solid #a29bfe;border-radius:6px;padding:8px 14px;flex:1;min-width:100px">
        <div style="font-size:10px;text-transform:uppercase;color:#6b8299;letter-spacing:.5px">Triage Rate</div>
        <div style="font-size:20px;font-weight:700;color:${progressCol}">${triagePct}%</div></div>
    </div>`;

  // Build Apply result panel with chart
  const tfaBreakdown=Object.entries(tfa.tfa||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);

  let triageHtml=`<div class="panel" style="margin-top:16px">
    <h3>Triage Breakdown: ${escHtml(filterLabel)} · ${dateLabel}</h3>
    <p class="panel-sub">Classification breakdown for the selected date range. Click cards or chart segments to view in Jira.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px">
      <div style="position:relative;height:240px"><canvas id="triage-date-chart"></canvas></div>
      <div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">`;
  links.forEach(l=>{
    const count=tfa.tfa&&tfa.tfa[l.label]?tfa.tfa[l.label]:0;
    triageHtml+=`<a href="${l.url}" target="_blank" style="text-decoration:none;background:#132f4c;border:1px solid #1e4976;border-radius:8px;padding:6px 10px;font-size:11px;color:#ccc;display:inline-flex;align-items:center;gap:4px">
      <span style="width:8px;height:8px;border-radius:50%;background:${TFA_COLORS[l.label]||'#6b8299'};display:inline-block"></span>
      ${l.name}: <strong style="color:#fff">${count}</strong> ↗</a>`;
  });
  triageHtml+=`</div>
        <div style="font-size:12px;color:#8899aa;margin-top:8px">
          <div style="margin-bottom:4px">Classified: <strong style="color:#2ed573">${tfa.classified}</strong> of ${tfa.total_failed} (<strong style="color:${progressCol}">${triagePct}%</strong>)</div>
          <div>Unclassified: <strong style="color:#ff4757">${tfa.unclassified}</strong> — <a href="https://issues.redhat.com/issues/?jql=${encodeURIComponent(unclassifiedJql)}" target="_blank" style="color:#ff4757">view in Jira ↗</a></div>
        </div>
      </div>
    </div>
  </div>`;

  const panel=document.getElementById('tfa-triage-panel');
  panel.innerHTML=triageHtml;

  // Render doughnut chart
  if(tfa.total_failed>0){
    const ctx=document.getElementById('triage-date-chart').getContext('2d');
    const chartLabels=tfaBreakdown.length>0?
      tfaBreakdown.map(([k])=>TFA_NAMES[k]||k).concat(tfa.unclassified>0?['Unclassified']:[]):
      ['Classified','Unclassified'];
    const chartData=tfaBreakdown.length>0?
      tfaBreakdown.map(([,v])=>v).concat(tfa.unclassified>0?[tfa.unclassified]:[]):
      [tfa.classified,tfa.unclassified];
    const chartColors=tfaBreakdown.length>0?
      tfaBreakdown.map(([k])=>TFA_COLORS[k]||'#6b8299').concat(tfa.unclassified>0?['#ff4757']:[]):
      ['#2ed573','#ff4757'];
    new Chart(ctx,{
      type:'doughnut',
      data:{labels:chartLabels,datasets:[{data:chartData,backgroundColor:chartColors,borderColor:'#0d2137',borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,
        onClick:(evt,elems)=>{if(elems.length>0){const idx=elems[0].index;
          if(idx<tfaBreakdown.length){const lbl=tfaBreakdown[idx][0];const l=links.find(x=>x.label===lbl);if(l)window.open(l.url,'_blank')}
          else{window.open('https://issues.redhat.com/issues/?jql='+encodeURIComponent(unclassifiedJql),'_blank')}}},
        onHover:(evt,elems)=>{ctx.canvas.style.cursor=elems.length>0?'pointer':'default'},
        plugins:{legend:{position:'bottom',labels:{color:'#ccc',font:{size:10},padding:6}},
          tooltip:{callbacks:{label:ct=>{const total=ct.dataset.data.reduce((a,b)=>a+b,0);return`${ct.label}: ${ct.raw} (${total>0?Math.round(ct.raw/total*100):0}%) — click to view in Jira`}}}}}
    });
  }

  panel.scrollIntoView({behavior:'smooth',block:'start'});
  const btn=document.getElementById('tfa-refresh-btn');
  if(btn){btn.style.background='#2ed573';btn.textContent='Applied ✓';setTimeout(()=>{btn.style.background='#1976d2';btn.textContent='Apply'},1500)}
}

// --- Boot ---
(async()=>{await loadJiraConfig();loadComponent()})();
</script>
