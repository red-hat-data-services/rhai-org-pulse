<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Component Detail</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a1929;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
a{color:#5ea7ff;text-decoration:none}a:hover{text-decoration:underline}
.container{max-width:1500px;margin:0 auto;padding:24px 32px}
.back-link{font-size:13px;margin-bottom:8px;display:inline-block}

.header-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:20px}
.header-left h1{font-size:24px;font-weight:700;color:#fff;margin-bottom:4px}
.header-left p{font-size:13px;color:#8899aa;max-width:700px;line-height:1.5}

.filter-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filter-group{display:flex;flex-direction:column;gap:2px}
.filter-label{font-size:9px;text-transform:uppercase;color:#6b8299;letter-spacing:.5px;font-weight:600}
.filter-value{font-size:12px;color:#fff;font-weight:500}
.filter-bar select,.filter-bar input[type="date"]{
  background:#132f4c;color:#fff;border:1px solid #1e4976;border-radius:4px;
  padding:5px 8px;font-size:12px;cursor:pointer;outline:none;min-width:90px;
  appearance:auto;-webkit-appearance:auto;
}
.filter-bar select:hover,.filter-bar input[type="date"]:hover{border-color:#3a6ea5}
.filter-bar input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer}

/* Metric cards */
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}
.mc{border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.mc .mc-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.8;font-weight:600}
.mc .mc-value{font-size:32px;font-weight:700;color:#fff}
.mc-results{background:#132f4c}
.mc-passed{background:#00b894}
.mc-failed{background:#ff4757}
.mc-skipped{background:#132f4c}
.mc-pct{background:rgba(162,155,254,.15);border:1px solid rgba(162,155,254,.3)}

/* Alert bars */
.alerts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.alert-bar{border-radius:6px;padding:12px 18px;border-left:4px solid}
.alert-failed{background:rgba(255,71,87,.1);border-color:#ff4757}
.alert-skipped{background:rgba(255,165,2,.1);border-color:#ffa502}
.alert-bar .alert-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:4px}
.alert-failed .alert-title{color:#ff4757}
.alert-skipped .alert-title{color:#ffa502}
.alert-bar .alert-count{font-size:28px;font-weight:700;color:#fff}
.alert-bar .alert-count a{color:inherit;text-decoration:underline;text-decoration-style:dotted}
.alert-bar .alert-desc{font-size:12px;color:#8899aa;margin-top:2px}

/* Grid layouts */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-bottom:24px}
@media(max-width:1000px){.two-col,.three-col{grid-template-columns:1fr}}

.panel{background:#0d2137;border:1px solid #1e4976;border-radius:8px;padding:20px}
.panel h3{font-size:15px;font-weight:600;color:#fff;margin-bottom:4px}
.panel .panel-sub{font-size:11px;color:#6b8299;margin-bottom:14px}
.panel-full{grid-column:1/-1}

/* Gate heatmap — matches main dashboard style */
.gate-heatmap-wrap{overflow-x:auto;overflow-y:visible;position:relative}
table.gate-hm{width:100%;border-collapse:collapse}
table.gate-hm th,table.gate-hm td{padding:6px 5px;text-align:center;border-bottom:1px solid #1e4976;white-space:nowrap;font-size:11px;position:relative}
table.gate-hm th{color:#6b8299;font-weight:600;position:sticky;top:0;background:#0d2137;z-index:5}
table.gate-hm th:first-child,table.gate-hm td:first-child{text-align:left;min-width:100px;font-weight:500}

.gate-cell{display:inline-block;border-radius:6px;padding:6px 6px 4px;min-width:56px;text-align:center;cursor:pointer;position:relative}
.gc-green{background:rgba(46,213,115,.15);border:1px solid rgba(46,213,115,.3)}
.gc-amber{background:rgba(255,165,2,.12);border:1px solid rgba(255,165,2,.25)}
.gc-orange{background:rgba(225,112,85,.12);border:1px solid rgba(225,112,85,.25)}
.gc-red{background:rgba(255,71,87,.12);border:1px solid rgba(255,71,87,.25)}
.gc-na{color:#4a5568}
.gc-pct{font-size:14px;font-weight:700;line-height:1}
.gc-pct-green{color:#2ed573}.gc-pct-amber{color:#ffa502}.gc-pct-orange{color:#e17055}.gc-pct-red{color:#ff4757}
.gc-runs{font-size:9px;color:#8899aa;margin-top:2px}
.gc-marks{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:3px}
.gate-mark{cursor:pointer;font-size:13px}
.gate-mark-p{color:#2ed573}.gate-mark-f{color:#ff4757}

/* Gate hover dropdown */
.gc-dropdown{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:#132f4c;border:1px solid #1e4976;border-radius:8px;padding:8px 0;z-index:200;
  min-width:280px;max-height:300px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.6);text-align:left}
.gc-dropdown.gc-dd-below{bottom:auto;top:calc(100% + 6px)}
.gate-cell:hover .gc-dropdown{display:block}
.gc-dd-title{padding:6px 14px 4px;font-size:10px;color:#6b8299;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1e4976;margin-bottom:4px}
.gc-dd-run{padding:5px 14px;border-bottom:1px solid rgba(30,73,118,.3)}
.gc-dd-run:last-child{border-bottom:none}
.gc-dd-run a{color:#5ea7ff;font-size:11px}
.gc-dd-state{font-size:10px;font-weight:700;margin-left:auto}

/* Charts */
.chart-container{position:relative;width:100%;height:260px}
.chart-container canvas{width:100%!important;height:100%!important}
.chart-lg{height:300px}

/* TFA legend */
.tfa-legend{margin-top:12px}
.tfa-legend-item{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px;color:#8899aa}
.tfa-legend-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* Version toggles */
.version-toggles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.version-toggles label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:#ccc;
  background:#132f4c;border:1px solid #1e4976;border-radius:4px;padding:4px 10px}
.version-toggles input[type="checkbox"]{accent-color:#5ea7ff}

/* Help box */
.help-box{background:rgba(94,167,255,.06);border:1px solid rgba(94,167,255,.15);border-radius:8px;padding:14px 18px;margin-top:12px}
.help-box h4{font-size:13px;color:#5ea7ff;margin-bottom:6px}
.help-box p,.help-box li{font-size:12px;color:#8899aa;line-height:1.6}
.help-box ul{padding-left:18px;margin-top:4px}

.loading{text-align:center;padding:60px;color:#6b8299;font-size:16px}
.error{text-align:center;padding:60px;color:#ff4757;font-size:15px}
</style>
</head>
<body>
<div class="container" id="main"><div class="loading">Loading…</div></div>

<script>
const $=id=>document.getElementById(id);
let jiraConfig=null;

function getParam(n,fb){return new URLSearchParams(location.search).get(n)||fb}
function formatDate(d){return d.toISOString().slice(0,10)}
function friendlyDate(iso){const d=new Date(iso+'T00:00:00');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getDate()}
function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function passPct(p,t){return t>0?Math.round(p/t*100):0}
function pctColor(pct){if(pct>=95)return'green';if(pct>=80)return'amber';if(pct>=60)return'orange';return'red'}

function currentFilters(){
  const d30=new Date();d30.setDate(d30.getDate()-30);
  return{environment:getParam('environment','RHOAI'),version:getParam('version','All'),release:getParam('release','All'),
    from_date:getParam('from_date',formatDate(d30)),to_date:getParam('to_date',formatDate(new Date())),
    provider:getParam('provider','All'),cluster_type:getParam('cluster_type','All'),gate:getParam('gate','All')};
}
function backUrl(){return'index.html?'+new URLSearchParams(currentFilters())}

function reloadWithFilters(){
  const comp=getParam('component',''),f=currentFilters();
  ['f-ver','f-rel','f-from','f-to'].forEach(id=>{const el=document.getElementById(id);if(el){
    const key=({['f-ver']:'version',['f-rel']:'release',['f-from']:'from_date',['f-to']:'to_date'})[id];
    f[key]=el.value;
  }});
  f.component=comp;
  location.search='?'+new URLSearchParams(f);
}

// --- Load Jira config ---
async function loadJiraConfig(){
  try{const r=await fetch(`/dashboard/data/jira_config.json?_=${Date.now()}`);if(r.ok)jiraConfig=await r.json()}catch(_){}
}

// --- Jira helpers ---
function buildJiraUrl(comp,label,ver,rel){
  if(!jiraConfig)return null;
  const rels=jiraConfig.releases||{};
  let matching=[];
  const keys=Object.keys(rels);
  if(ver!=='All'&&rel!=='All'){const k=`${ver}|${rel}`;if(rels[k])matching=[rels[k]]}
  else if(ver!=='All') keys.filter(k=>k.startsWith(ver+'|')).forEach(k=>matching.push(rels[k]));
  else if(rel!=='All') keys.filter(k=>k.endsWith('|'+rel)).forEach(k=>matching.push(rels[k]));
  else ['3.5|GA','3.5|EA1','3.5|EA2','3.6|EA1','3.6|EA2'].forEach(k=>{if(rels[k])matching.push(rels[k])});
  if(!matching.length)return null;
  const fvs=new Set();matching.forEach(r=>{fvs.add(`'${r.rhoai_jira_version}'`);fvs.add(`'${r.fix_version}'`)});
  const fvList=Array.from(fvs).join(', ');
  let tc=null;const cm=jiraConfig.component_team_map||{};
  if(cm[comp])tc=cm[comp];else{const lc=comp.toLowerCase();for(const[k,v]of Object.entries(cm)){if(k.toLowerCase().includes(lc)||lc.includes(k.toLowerCase())){tc=v;break}}}
  const proj=matching[0].project||'RHOAIENG';
  let jql=`project = ${proj}`;if(tc)jql+=` AND Team = "${tc}"`;
  jql+=` AND (fixVersion IN (${fvList}) OR affectedVersion IN (${fvList}) OR 'Target Version' IN (${fvList}))`;
  jql+=` AND labels = "${label}"`;
  return`https://issues.redhat.com/issues/?jql=${encodeURIComponent(jql)}`;
}

function getJiraCount(comp,label,ver,rel){
  if(!jiraConfig||!jiraConfig.counts)return null;
  const ck=Object.keys(jiraConfig.counts);
  let mk=[];
  if(ver!=='All'&&rel!=='All')mk=[`${ver}|${rel}`].filter(k=>jiraConfig.counts[k]);
  else if(ver!=='All')mk=ck.filter(k=>k.startsWith(ver+'|'));
  else if(rel!=='All')mk=ck.filter(k=>k.endsWith('|'+rel));
  else mk=ck;
  let total=0,found=false;
  mk.forEach(rk=>{
    const tc=jiraConfig.counts[rk];
    Object.entries(tc).forEach(([c,counts])=>{
      if(c===comp||c.toLowerCase().includes(comp.toLowerCase())||comp.toLowerCase().includes(c.toLowerCase())){
        total+=(label==='test-failed'?counts.failed:counts.skipped)||0;found=true;
      }
    });
  });
  return found?total:null;
}

function getTfaData(comp,ver,rel){
  if(!jiraConfig||!jiraConfig.tfa)return null;
  const tk=Object.keys(jiraConfig.tfa);
  let mk=[];
  if(ver!=='All'&&rel!=='All')mk=[`${ver}|${rel}`].filter(k=>jiraConfig.tfa[k]);
  else if(ver!=='All')mk=tk.filter(k=>k.startsWith(ver+'|'));
  else if(rel!=='All')mk=tk.filter(k=>k.endsWith('|'+rel));
  else mk=tk;

  const merged={tfa:{},classified:0,unclassified:0,status:{},total_failed:0};
  mk.forEach(rk=>{
    const teams=jiraConfig.tfa[rk]||{};
    Object.entries(teams).forEach(([c,data])=>{
      if(c===comp||c.toLowerCase().includes(comp.toLowerCase())||comp.toLowerCase().includes(c.toLowerCase())){
        Object.entries(data.tfa||{}).forEach(([k,v])=>{merged.tfa[k]=(merged.tfa[k]||0)+v});
        merged.classified+=data.classified||0;
        merged.unclassified+=data.unclassified||0;
        merged.total_failed+=data.total_failed||0;
        Object.entries(data.status||{}).forEach(([s,v])=>{merged.status[s]=(merged.status[s]||0)+v});
      }
    });
  });
  return merged.total_failed>0?merged:null;
}

// --- Filter static component data ---
function filterComponentData(data,f){
  const{from_date:from,to_date:to,version:ver,release:rel}=f;
  const d=JSON.parse(JSON.stringify(data));
  if(d.daily)d.daily=d.daily.filter(x=>x.date>=from&&x.date<=to);
  let tp=0,tf=0,ts=0,tt=0;
  (d.daily||[]).forEach(x=>{tp+=x.passed||0;tf+=x.failed||0;ts+=x.skipped||0;tt+=x.total||0});
  d.overall={total:tt,passed:tp,failed:tf,skipped:ts};
  if(d.quality_gates)Object.keys(d.quality_gates).forEach(g=>{
    const days=d.quality_gates[g];Object.keys(days).forEach(dt=>{if(dt<from||dt>to)delete days[dt]})});
  if(d.releases){
    if(rel!=='All')d.releases=d.releases.filter(r=>r.release===rel);
    d.releases.forEach(r=>{if(r.daily)r.daily=r.daily.filter(x=>x.date>=from&&x.date<=to)});
  }
  return d;
}

// --- Load component ---
async function loadComponent(){
  const main=$('main');
  const comp=getParam('component','');
  if(!comp){main.innerHTML='<div class="error">No component specified. <a href="index.html">Back</a></div>';return}

  try{
    let data;const f=currentFilters();f.component=comp;
    // Load full components JSON and heatmap JSON
    const [r2, r3]=await Promise.all([
      fetch(`/dashboard/data/components.json?_=${Date.now()}`),
      fetch(`/dashboard/data/heatmap.json?_=${Date.now()}`)
    ]);
    if(r2.ok){const all=await r2.json();if(all[comp])data=filterComponentData(all[comp],f)}
    if(!data)throw new Error('No data for "'+comp+'"');
    // Extract this component's by_vr data from heatmap for version chart
    let compHeatmap=null;
    if(r3.ok){const hm=await r3.json();compHeatmap=(hm.components||[]).find(c=>c.component===comp)}
    render(data,comp,compHeatmap);
  }catch(e){main.innerHTML=`<div class="error">Failed: ${e.message}<br><a href="${backUrl()}">Back</a></div>`}
}

// --- Render ---
function render(data,comp,compHeatmap){
  const f=currentFilters();
  const ov=data.overall||{};
  const daily=(data.daily||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const qg=data.quality_gates||{};
  const releases=data.releases||[];
  const pct=passPct(ov.passed||0,ov.total||0);

  const failedUrl=buildJiraUrl(comp,'test-failed',f.version,f.release);
  const skippedUrl=buildJiraUrl(comp,'test-skipped',f.version,f.release);
  const failedCount=getJiraCount(comp,'test-failed',f.version,f.release);
  const skippedCount=getJiraCount(comp,'test-skipped',f.version,f.release);
  const tfaData=getTfaData(comp,f.version,f.release);
  const filterLabel=[f.version!=='All'?f.version:'',f.release!=='All'?f.release:''].filter(Boolean).join(' ')||'All releases';

  $('main').innerHTML=`
    <a class="back-link" href="${backUrl()}">← Back to heatmap</a>
    <div class="header-row">
      <div class="header-left">
        <h1>${escHtml(comp)}</h1>
        <p>Deep-dive into quality gates, execution trends, and Jira failure classification for this component.</p>
      </div>
      <div class="filter-bar">
        <div class="filter-group"><span class="filter-label">Environment</span><span class="filter-value">RHOAI</span></div>
        <div class="filter-group"><span class="filter-label">Version</span>
          <select id="f-ver" onchange="reloadWithFilters()">
            <option value="All" ${f.version==='All'?'selected':''}>All</option>
            <option value="2.25" ${f.version==='2.25'?'selected':''}>2.25</option>
            <option value="3.4" ${f.version==='3.4'?'selected':''}>3.4</option>
            <option value="3.5" ${f.version==='3.5'?'selected':''}>3.5</option>
            <option value="3.6" ${f.version==='3.6'?'selected':''}>3.6</option>
          </select></div>
        <div class="filter-group"><span class="filter-label">Release</span>
          <select id="f-rel" onchange="reloadWithFilters()">
            <option value="All" ${f.release==='All'?'selected':''}>All</option>
            <option value="GA" ${f.release==='GA'?'selected':''}>GA</option>
            <option value="EA1" ${f.release==='EA1'?'selected':''}>EA1</option>
            <option value="EA2" ${f.release==='EA2'?'selected':''}>EA2</option>
          </select></div>
        <div class="filter-group"><span class="filter-label">From</span>
          <input type="date" id="f-from" value="${f.from_date}" onchange="reloadWithFilters()"></div>
        <div class="filter-group"><span class="filter-label">To</span>
          <input type="date" id="f-to" value="${f.to_date}" onchange="reloadWithFilters()"></div>
      </div>
    </div>
    <div class="help-box" style="margin-bottom:16px">
      <h4>ℹ️ Filters apply to everything on this page</h4>
      <p>Changing Version, Release, or Date range will reload all data — metric cards, heatmap, charts, and Jira counts will update to match your selection. The filter state is preserved in the URL, so you can bookmark or share specific views.</p>
    </div>

    <!-- Metric cards -->
    <div style="font-size:12px;color:#6b8299;margin-bottom:6px">Showing: ${escHtml(filterLabel)} · ${friendlyDate(f.from_date)} – ${friendlyDate(f.to_date)} · ${(daily.filter(d=>(d.total||0)>0).length)} days with data</div>
    <div class="metrics">
      <div class="mc mc-results"><span class="mc-label">Total Tests</span><span class="mc-value">${(ov.total||0).toLocaleString()}</span><span style="font-size:10px;opacity:.7;margin-top:2px">Sum of all test cases</span></div>
      <div class="mc mc-passed"><span class="mc-label">Passed</span><span class="mc-value">${(ov.passed||0).toLocaleString()}</span><span style="font-size:10px;opacity:.7;margin-top:2px">Completed successfully</span></div>
      <div class="mc mc-failed"><span class="mc-label">Failed</span><span class="mc-value">${(ov.failed||0).toLocaleString()}</span><span style="font-size:10px;opacity:.7;margin-top:2px">Assertion / runtime errors</span></div>
      <div class="mc mc-skipped"><span class="mc-label">Skipped</span><span class="mc-value">${(ov.skipped||0).toLocaleString()}</span><span style="font-size:10px;opacity:.7;margin-top:2px">Not executed (scope / deps)</span></div>
      <div class="mc mc-pct"><span class="mc-label">Pass Rate</span><span class="mc-value">${pct}%</span><span style="font-size:10px;opacity:.7;margin-top:2px">Passed ÷ Total × 100</span></div>
    </div>

    <!-- Jira alerts -->
    <div class="alerts">
      <div class="alert-bar alert-failed">
        <div class="alert-title">Open Failed Jiras</div>
        <div class="alert-count">${failedUrl?`<a href="${failedUrl}" target="_blank">${failedCount!==null?failedCount:'–'}</a>`:'–'}</div>
        <div class="alert-desc">${failedUrl?`<a href="${failedUrl}" target="_blank" style="color:#ff4757;font-size:12px">🔍 View test-failed for ${escHtml(filterLabel)} →</a>`:'<span style="color:#6b8299">Select version/release</span>'}</div>
        <div style="font-size:10px;color:#6b8299;margin-top:6px">Jira issues labeled <code style="background:#1e3a5f;padding:1px 4px;border-radius:3px;font-size:10px">test-failed</code> filed against this component's team. Click the count to view in Jira.</div>
      </div>
      <div class="alert-bar alert-skipped">
        <div class="alert-title">Open Skipped Jiras</div>
        <div class="alert-count">${skippedUrl?`<a href="${skippedUrl}" target="_blank">${skippedCount!==null?skippedCount:'–'}</a>`:'–'}</div>
        <div class="alert-desc">${skippedUrl?`<a href="${skippedUrl}" target="_blank" style="color:#ffa502;font-size:12px">🔍 View test-skipped for ${escHtml(filterLabel)} →</a>`:'<span style="color:#6b8299">Select version/release</span>'}</div>
        <div style="font-size:10px;color:#6b8299;margin-top:6px">Jira issues labeled <code style="background:#1e3a5f;padding:1px 4px;border-radius:3px;font-size:10px">test-skipped</code>. These track tests intentionally disabled or blocked by known bugs.</div>
      </div>
    </div>

    <!-- Row 1: Gate heatmap (full width, like main dashboard) -->
    <div class="panel" style="margin-bottom:24px">
      <h3>Quality Gates Heatmap</h3>
      <p class="panel-sub">Per-gate, per-day results for ${escHtml(comp)}. Each cell shows pass %, color-coded like the main heatmap. Hover for Jenkins run details.</p>
      <div id="qg-wrap" class="gate-heatmap-wrap"></div>
      <div class="help-box">
        <h4>How to read quality gates</h4>
        <ul>
          <li><strong>Rows</strong> = quality gates (smoke, tier1, tier2, tier3). The gate name shows overall pass % and total runs.</li>
          <li><strong>Columns</strong> = dates. Each cell shows pass % with color: <span style="color:#2ed573">green ≥95%</span> · <span style="color:#ffa502">amber 80–94%</span> · <span style="color:#e17055">orange 60–79%</span> · <span style="color:#ff4757">red &lt;60%</span>.</li>
          <li><strong>P/F counts</strong> below the percentage show how many runs passed vs failed that day.</li>
          <li><strong>Colored marks</strong>: <span style="color:#2ed573">✓</span> = passed, <span style="color:#ff4757">●</span> = failed. Click a mark to open Jenkins. Hover the cell for a dropdown with each run link.</li>
        </ul>
      </div>
    </div>

    <!-- Row 2: Daily chart (full width) -->
    <div class="panel" style="margin-bottom:24px">
      <h3>Execution Over Time</h3>
      <p class="panel-sub">Daily <strong>aggregate</strong> pass / fail / skip for ${escHtml(comp)} — all runs on the same day are summed.</p>

// --- Gate heatmap ---
function renderGateHeatmap(qg,daily){
  const wrap=document.getElementById('qg-wrap');
  const gates=Object.keys(qg).sort();
  const dates=[...new Set(daily.filter(d=>d.total>0).map(d=>d.date))].sort((a,b)=>b.localeCompare(a));
  if(!gates.length||!dates.length){wrap.innerHTML='<p style="color:#6b8299;font-size:13px;padding:8px">No quality gate data for this filter.</p>';return}

  let html='<table class="gate-hm"><thead><tr><th>Gate</th>';
  dates.forEach(d=>html+=`<th><div style="display:flex;flex-direction:column;align-items:center;gap:1px"><span>${friendlyDate(d)}</span></div></th>`);
  html+='</tr></thead><tbody>';

  gates.forEach((g,gIdx)=>{
    // Gate-level aggregate
    let gateTotal=0,gatePass=0;
    dates.forEach(d=>{const execs=qg[g]&&qg[g][d];if(execs)execs.forEach(ex=>{gateTotal++;if(ex.state==='PASSED')gatePass++})});
    const gatePct=passPct(gatePass,gateTotal);
    const gateCol=pctColor(gatePct);

    html+=`<tr><td style="color:#${gateCol==='green'?'2ed573':gateCol==='amber'?'ffa502':gateCol==='orange'?'e17055':'ff4757'};font-weight:600">${escHtml(g)}<div style="font-size:9px;color:#6b8299">${gatePct}% · ${gateTotal} runs</div></td>`;

    // For top rows, dropdown opens below
    const ddClass=gIdx<2?'gc-dropdown gc-dd-below':'gc-dropdown';

    dates.forEach(d=>{
      const execs=qg[g]&&qg[g][d];
      if(!execs||!execs.length){html+='<td><span class="gc-na">–</span></td>';return}

      // Aggregate for cell color
      let tp=0,tf=0;
      execs.forEach(ex=>{if(ex.state==='PASSED')tp++;else tf++});
      const total=tp+tf;
      const pct=passPct(tp,total);
      const col=pctColor(pct);

      // Individual marks
      const marks=execs.map(ex=>{
        const cls=ex.state==='PASSED'?'gate-mark-p':'gate-mark-f';
        const sym=ex.state==='PASSED'?'✓':'●';
        return ex.jenkins_url?`<a href="${ex.jenkins_url}" target="_blank" class="gate-mark ${cls}" title="${ex.state} — click for Jenkins">${sym}</a>`
          :`<span class="gate-mark ${cls}">${sym}</span>`;
      }).join('');

      // Build hover dropdown (like main dashboard)
      let dropdown=`<div class="${ddClass}">`;
      dropdown+=`<div class="gc-dd-title">${escHtml(g)} · ${friendlyDate(d)} · ${execs.length} run${execs.length!==1?'s':''}</div>`;
      execs.forEach(ex=>{
        const stateCol=ex.state==='PASSED'?'#2ed573':'#ff4757';
        const label=ex.jenkins_url?ex.jenkins_url.replace('https://jenkins-csb-rhods-opendatascience.dno.corp.redhat.com/job/','').replace(/\/$/,'').replace(/\/job\//g,'/'):'Run';
        dropdown+=`<div class="gc-dd-run" style="display:flex;justify-content:space-between;align-items:center">`;
        dropdown+=ex.jenkins_url?`<a href="${ex.jenkins_url}" target="_blank">${label}</a>`:`<span>${label}</span>`;
        dropdown+=`<span class="gc-dd-state" style="color:${stateCol}">${ex.state}</span></div>`;
      });
      dropdown+='</div>';

      html+=`<td><div class="gate-cell gc-${col}">
        <div class="gc-pct gc-pct-${col}">${pct}%</div>
        <div class="gc-runs">${tp}P ${tf}F</div>
        <div class="gc-marks">${marks}</div>
        ${dropdown}</div></td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  wrap.innerHTML=html;
}

// --- Version trend chart (groups by version, combines all releases EA1+EA2+GA) ---
let relChart=null;

function renderVersionChart(compHeatmap,filters){
  const toggles=document.getElementById('ver-toggles');
  if(!compHeatmap||!compHeatmap.days){toggles.innerHTML='<span style="color:#6b8299;font-size:12px">No version data available.</span>';return}

  // Build version→date→{p,f,s} from by_vr keys
  const verDayMap={}; // "3.5" → { "2026-09-10": {p,f,s} }
  const versions=new Set();
  const {from_date:from,to_date:to}=filters;

  Object.entries(compHeatmap.days).forEach(([date,day])=>{
    if(date<from||date>to) return;
    if(!day.by_vr) return;
    Object.entries(day.by_vr).forEach(([vrKey,vr])=>{
      // Extract major version: "3.5|GA" → "3.5", "3.6-ea.1|EA1" → "3.6"
      const ver=vrKey.split('|')[0].split('-')[0];
      versions.add(ver);
      if(!verDayMap[ver])verDayMap[ver]={};
      if(!verDayMap[ver][date])verDayMap[ver][date]={p:0,f:0,s:0};
      verDayMap[ver][date].p+=(vr.passed||0);
      verDayMap[ver][date].f+=(vr.failed||0);
      verDayMap[ver][date].s+=(vr.skipped||0);
    });
  });

  if(!versions.size){toggles.innerHTML='<span style="color:#6b8299;font-size:12px">No version data for this date range.</span>';return}

  const sortedVer=Array.from(versions).sort();
  toggles.innerHTML=sortedVer.map(v=>`<label><input type="checkbox" value="${v}" checked onchange="updateVersionChart()"> ${v}</label>`).join('');
  window._verDayMap=verDayMap;
  updateVersionChart();
}

function updateVersionChart(){
  const verDayMap=window._verDayMap||{};
  const checked=Array.from(document.querySelectorAll('#ver-toggles input:checked')).map(i=>i.value);

  const allDates=new Set();
  checked.forEach(v=>{if(verDayMap[v])Object.keys(verDayMap[v]).forEach(d=>allDates.add(d))});
  const dates=Array.from(allDates).sort();
  const labels=dates.map(friendlyDate);

  const colors=['#2ed573','#3498db','#e17055','#a29bfe','#fdcb6e','#6c5ce7','#00cec9','#fab1a0'];
  const datasets=[];let ci=0;
  checked.forEach(ver=>{
    const dm=verDayMap[ver]||{};
    const c=colors[ci%colors.length];ci++;
    datasets.push({
      label:`${ver} (passed)`,
      data:dates.map(d=>(dm[d]||{}).p||0),
      borderColor:c, backgroundColor:c+'22', tension:.3, fill:false, pointRadius:3, borderWidth:2
    });
  });

  const ctx=document.getElementById('chart-releases').getContext('2d');
  if(relChart)relChart.destroy();
  relChart=new Chart(ctx,{
    type:'line',data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{color:'#8899aa',usePointStyle:true,pointStyle:'rect',padding:14,font:{size:11}}}},
      scales:{x:{ticks:{color:'#6b8299',font:{size:10}},grid:{color:'rgba(30,73,118,.2)'}},
        y:{ticks:{color:'#6b8299',font:{size:10}},grid:{color:'rgba(30,73,118,.3)'},beginAtZero:true}}
    }
  });
}

const TFA_COLORS={
  'tfa-product-bug':'#ff4757','tfa-automation-bug':'#ffa502','tfa-infra-issue':'#3498db',
  'tfa-env-setup':'#a29bfe','tfa-duplicate':'#6b8299','tfa-known-issue':'#fdcb6e',
  'tfa-false-positive':'#2ed573','tfa-wrong-assignment':'#e17055'
};
const TFA_NAMES={
  'tfa-product-bug':'Product Bug','tfa-automation-bug':'Automation Bug','tfa-infra-issue':'Infra Issue',
  'tfa-env-setup':'Env Setup','tfa-duplicate':'Duplicate','tfa-known-issue':'Known Issue',
  'tfa-false-positive':'False Positive','tfa-wrong-assignment':'Wrong Assignment'
};
const TFA_DESC={
  'tfa-product-bug':'Real product issue found by the test',
  'tfa-automation-bug':'Test code issue or flaky automation',
  'tfa-infra-issue':'Infrastructure instability or defect',
  'tfa-env-setup':'Environment setup issue (e.g., missing dependency)',
  'tfa-duplicate':'Same root cause as another tracked issue',
  'tfa-known-issue':'Failure matches an already known and tracked issue',
  'tfa-false-positive':'Passed on re-run, non-reproducible',
  'tfa-wrong-assignment':'Failure initially routed to wrong component'
};

// Build JQL for a specific TFA label (or 'unclassified' / 'all-test-failed' / status:XYZ)
function buildTfaJql(type,value){
  const comp=window._currentComp;
  const f=window._currentFilters;
  if(!comp||!f||!jiraConfig)return null;
  const rels=jiraConfig.releases||{};
  let matching=[];const rk=Object.keys(rels);
  if(f.version!=='All'&&f.release!=='All')matching=[rels[`${f.version}|${f.release}`]].filter(Boolean);
  else if(f.version!=='All')rk.filter(k=>k.startsWith(f.version+'|')).forEach(k=>matching.push(rels[k]));
  else if(f.release!=='All')rk.filter(k=>k.endsWith('|'+f.release)).forEach(k=>matching.push(rels[k]));
  else ['3.5|GA','3.5|EA1','3.5|EA2','3.6|EA1','3.6|EA2'].forEach(k=>{if(rels[k])matching.push(rels[k])});
  if(!matching.length)return null;
  const fvs=new Set();matching.forEach(r=>{fvs.add(`'${r.rhoai_jira_version}'`);fvs.add(`'${r.fix_version}'`)});
  const fvList=Array.from(fvs).join(', ');
  const cm=jiraConfig.component_team_map||{};
  let tc=null;
  if(cm[comp])tc=cm[comp];else{const lc=comp.toLowerCase();for(const[k,v]of Object.entries(cm)){if(k.toLowerCase().includes(lc)||lc.includes(k.toLowerCase())){tc=v;break}}}
  const proj=matching[0].project||'RHOAIENG';
  let jql=`project = ${proj}`;if(tc)jql+=` AND Team = "${tc}"`;
  jql+=` AND (fixVersion IN (${fvList}) OR affectedVersion IN (${fvList}) OR 'Target Version' IN (${fvList}))`;
  jql+=` AND labels = "test-failed"`;
  const allTfaLabels='"tfa-product-bug","tfa-automation-bug","tfa-infra-issue","tfa-env-setup","tfa-duplicate","tfa-known-issue","tfa-false-positive","tfa-wrong-assignment"';
  if(type==='tfa-label')jql+=` AND labels = "${value}"`;
  else if(type==='classified')jql+=` AND labels IN (${allTfaLabels})`;
  else if(type==='unclassified')jql+=` AND labels NOT IN (${allTfaLabels})`;
  else if(type==='status')jql+=` AND status = "${value}"`;
  return`https://issues.redhat.com/issues/?jql=${encodeURIComponent(jql)}`;
}

function renderTfaCharts(tfa){

  const tfaEntries=Object.entries(tfa.tfa||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);

    const pieCtx=pieCanvas.getContext('2d');
    const pieChart=new Chart(pieCtx,{
      type:'doughnut',
      data:{
        labels:tfaEntries.map(([k])=>TFA_NAMES[k]||k),
        datasets:[{data:tfaEntries.map(([,v])=>v),backgroundColor:tfaEntries.map(([k])=>TFA_COLORS[k]||'#6b8299'),borderColor:'#0d2137',borderWidth:2}]
      },
      options:{responsive:true,maintainAspectRatio:false,
        onClick:(evt,elems)=>{
          if(elems.length>0){const idx=elems[0].index;const label=tfaEntries[idx][0];const url=buildTfaJql('tfa-label',label);if(url)window.open(url,'_blank')}
        },
        onHover:(evt,elems)=>{pieCanvas.style.cursor=elems.length>0?'pointer':'default'},

    });
    // Legend (clickable)

    legend.innerHTML=tfaEntries.map(([k,v])=>{

      const linkEnd=url?'</a>':'';

  // 2. Bar chart — Classified vs Unclassified (clickable)

  new Chart(barCtx,{
    type:'bar',
    data:{
      labels:[...allLabels.map(k=>TFA_NAMES[k]),'Unclassified'],
      datasets:[{label:'Issues',data:barValues,
        backgroundColor:[...allLabels.map(k=>TFA_COLORS[k]),'#4a5568'],borderRadius:4}]
    },
    options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
      onClick:(evt,elems)=>{
        if(elems.length>0){
          const idx=elems[0].index;const key=barLabelsRaw[idx];
          const url=key==='__unclassified'?buildTfaJql('unclassified'):buildTfaJql('tfa-label',key);
          if(url)window.open(url,'_blank');
        }
      },
      onHover:(evt,elems)=>{barCanvas.style.cursor=elems.length>0?'pointer':'default'},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.raw} issues — click to view in Jira`}}},
      scales:{x:{ticks:{color:'#6b8299',font:{size:10}},grid:{color:'rgba(30,73,118,.2)'},beginAtZero:true},
        y:{ticks:{color:'#ccc',font:{size:10}},grid:{display:false}}}}
  });

  // 3. Status bar chart (clickable)
  const statusCanvas=document.getElementById('chart-status-bar');
  const statusCtx=statusCanvas.getContext('2d');
  const statusEntries=Object.entries(tfa.status||{}).sort((a,b)=>b[1]-a[1]);
  const statusColors={'Open':'#ff4757','In Progress':'#ffa502','To Do':'#a29bfe','In Review':'#3498db',
    'Closed':'#2ed573','Done':'#2ed573','Resolved':'#00b894'};
  new Chart(statusCtx,{
    type:'bar',
    data:{
      labels:statusEntries.map(([s])=>s),
      datasets:[{label:'Issues',data:statusEntries.map(([,v])=>v),
        backgroundColor:statusEntries.map(([s])=>statusColors[s]||'#6b8299'),borderRadius:4}]
    },
    options:{responsive:true,maintainAspectRatio:false,
      onClick:(evt,elems)=>{
        if(elems.length>0){const idx=elems[0].index;const status=statusEntries[idx][0];const url=buildTfaJql('status',status);if(url)window.open(url,'_blank')}
      },
      onHover:(evt,elems)=>{statusCanvas.style.cursor=elems.length>0?'pointer':'default'},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.raw} issues — click to view in Jira`}}},
      scales:{x:{ticks:{color:'#ccc',font:{size:10}},grid:{color:'rgba(30,73,118,.2)'}},
        y:{ticks:{color:'#6b8299',font:{size:10}},grid:{color:'rgba(30,73,118,.3)'},beginAtZero:true}}}
  });
}

// --- TFA Date Range Refresh ---
function refreshTfaData(){
  const comp=window._currentComp;
  const f=window._currentFilters;
  if(!comp||!f||!jiraConfig) return;

  const tfaFrom=document.getElementById('tfa-from').value;
  const tfaTo=document.getElementById('tfa-to').value;

  // Build JQL with creation date filter for each TFA chart
  const rels=jiraConfig.releases||{};
  let matchingRels=[];
  const rk=Object.keys(rels);
  if(f.version!=='All'&&f.release!=='All')matchingRels=[rels[`${f.version}|${f.release}`]].filter(Boolean);
  else if(f.version!=='All')rk.filter(k=>k.startsWith(f.version+'|')).forEach(k=>matchingRels.push(rels[k]));
  else if(f.release!=='All')rk.filter(k=>k.endsWith('|'+f.release)).forEach(k=>matchingRels.push(rels[k]));
  else ['3.5|GA','3.5|EA1','3.5|EA2','3.6|EA1','3.6|EA2'].forEach(k=>{if(rels[k])matchingRels.push(rels[k])});

  if(!matchingRels.length){alert('No matching release found.');return}
  const fvs=new Set();matchingRels.forEach(r=>{fvs.add(`'${r.rhoai_jira_version}'`);fvs.add(`'${r.fix_version}'`)});
  const fvList=Array.from(fvs).join(', ');
  const cm=jiraConfig.component_team_map||{};
  let tc=null;
  if(cm[comp])tc=cm[comp];else{const lc=comp.toLowerCase();for(const[k,v]of Object.entries(cm)){if(k.toLowerCase().includes(lc)||lc.includes(k.toLowerCase())){tc=v;break}}}
  const proj=matchingRels[0].project||'RHOAIENG';

  let baseJql=`project = ${proj}`;
  if(tc)baseJql+=` AND Team = "${tc}"`;
  baseJql+=` AND (fixVersion IN (${fvList}) OR affectedVersion IN (${fvList}) OR 'Target Version' IN (${fvList}))`;
  baseJql+=` AND labels = "test-failed"`;
  if(tfaFrom)baseJql+=` AND created >= "${tfaFrom}"`;
  if(tfaTo)baseJql+=` AND created <= "${tfaTo}"`;

  const filterLabel=[f.version!=='All'?f.version:'',f.release!=='All'?f.release:''].filter(Boolean).join(' ')||'All releases';
  const dateLabel=`${friendlyDate(tfaFrom)} – ${friendlyDate(tfaTo)}`;

  // Build links for each TFA label
  const links=[];
  Object.keys(TFA_NAMES).forEach(label=>{
    const jql=baseJql+` AND labels = "${label}"`;
    const url=`https://issues.redhat.com/issues/?jql=${encodeURIComponent(jql)}`;
    links.push({label,name:TFA_NAMES[label],url,jql});
  });
  const allUrl=`https://issues.redhat.com/issues/?jql=${encodeURIComponent(baseJql)}`;
  const classifiedJql=baseJql+' AND labels in ("tfa-product-bug","tfa-automation-bug","tfa-infra-issue","tfa-env-setup","tfa-duplicate","tfa-known-issue","tfa-false-positive","tfa-wrong-assignment")';
  const unclassifiedJql=baseJql+' AND labels NOT IN ("tfa-product-bug","tfa-automation-bug","tfa-infra-issue","tfa-env-setup","tfa-duplicate","tfa-known-issue","tfa-false-positive","tfa-wrong-assignment")';

  // Show triage links table
  const section=document.getElementById('tfa-section');
  let triageHtml=`<div class="panel" style="margin-top:16px;grid-column:1/-1">
    <h3>Triage Status: ${escHtml(filterLabel)} · ${dateLabel}</h3>
    <p class="panel-sub">Click any link below to view the matching Jira issues in your browser. Use this to track weekly triage progress.</p>
    <table style="width:100%;border-collapse:collapse;margin-top:10px">
      <tr style="border-bottom:1px solid #1e4976">
        <td style="padding:8px 12px;font-weight:600;color:#fff"><a href="${allUrl}" target="_blank" style="color:#5ea7ff">All test-failed</a></td>
        <td style="padding:8px 12px;color:#6b8299;font-size:12px">All test-failed Jiras created ${dateLabel}</td>
      </tr>
      <tr style="border-bottom:1px solid #1e4976">
        <td style="padding:8px 12px;font-weight:600;color:#2ed573"><a href="https://issues.redhat.com/issues/?jql=${encodeURIComponent(classifiedJql)}" target="_blank" style="color:#2ed573">Classified</a></td>
        <td style="padding:8px 12px;color:#6b8299;font-size:12px">Issues with any TFA label applied</td>
      </tr>
      <tr style="border-bottom:1px solid #1e4976">
        <td style="padding:8px 12px;font-weight:600;color:#ff4757"><a href="https://issues.redhat.com/issues/?jql=${encodeURIComponent(unclassifiedJql)}" target="_blank" style="color:#ff4757">Unclassified</a></td>
        <td style="padding:8px 12px;color:#6b8299;font-size:12px">Issues still needing triage (no TFA label)</td>
      </tr>`;
  links.forEach(l=>{
    triageHtml+=`<tr style="border-bottom:1px solid rgba(30,73,118,.3)">
      <td style="padding:6px 12px"><a href="${l.url}" target="_blank" style="color:#5ea7ff;font-size:13px">${l.name}</a></td>
      <td style="padding:6px 12px;color:#6b8299;font-size:11px">${TFA_DESC[l.label]||''}</td>
    </tr>`;
  });
  triageHtml+='</table></div>';

  // Insert or replace the triage panel
  let existing=document.getElementById('tfa-triage-panel');
  if(existing)existing.remove();
  const div=document.createElement('div');div.id='tfa-triage-panel';div.innerHTML=triageHtml;
  section.appendChild(div);
}

// --- Boot ---
(async()=>{await loadJiraConfig();loadComponent()})();
</script>
</body>
</html>
