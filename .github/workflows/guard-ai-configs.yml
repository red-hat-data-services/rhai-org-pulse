# Prevents unauthorized changes to AI agent configs (AGENTS.md, .claude/, etc.)
# and this workflow file itself. Uses the commit status API so that multiple
# workflow runs (pull_request_target + pull_request_review + issue_comment) update a single
# status rather than creating separate check runs. Add "AI Config Guard" as a
# required status check in branch protection to enforce.
#
# Uses pull_request_target (not pull_request) so that fork PRs get a write
# GITHUB_TOKEN and access to secrets. This is safe because the workflow never
# executes code from the PR — it only inspects file paths via the GitHub API.
# GitHub enforces that pull_request_target always runs the workflow file from
# the default branch, so a fork cannot modify these steps.
#
# Trade-off: changes to THIS workflow file cannot be tested in a PR — the
# version on main always runs. This is an acceptable security posture for a
# guard workflow.

name: Guard AI Configurations

on:
  pull_request_review:
    types:
      - submitted  # Re-evaluate when a reviewer approves
      - dismissed  # Re-evaluate when an approval is dismissed
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
  issue_comment:
    types:
      - created  # Count owner approval comments on PRs
      - edited   # Re-evaluate if an approval command is changed
      - deleted  # Re-evaluate if an approval command is removed
  merge_group:

jobs:
  # Merge queue no-op: the real guard check already ran on the PR. The queue
  # just needs the "AI Config Guard" commit status to exist and pass.
  merge-queue-pass:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      STATUS_CONTEXT: "AI Config Guard"
    steps:
      - name: Set success status for merge queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="${STATUS_CONTEXT}" \
            -f description="Merge queue — already verified on PR"

  check-ai-configs:
    if: github.event_name != 'merge_group' && (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # To post comments and read reviews
      statuses: write       # To set commit status via the API
    env:
      # GitHub team allowed to approve AI config changes (format: org/team-slug)
      ALLOWED_APPROVER_TEAM: "red-hat-data-services/org-pulse-maintainers"
      # Space-separated list of files/directories requiring owner approval.
      # Keep THIS workflow file in the list so it can't be changed without approval.
      SENSITIVE_FILES: ".claude/ AGENTS.md .github/workflows/guard-ai-configs.yml .github/instructions/review.instructions.md"
      STATUS_CONTEXT: "AI Config Guard"
    steps:
      - name: Resolve Pull Request Metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_PR: ${{ github.event.pull_request.number }}
          PR_NUMBER_REVIEW: ${{ github.event.review.pull_request.number }}
          PR_NUMBER_COMMENT: ${{ github.event.issue.number }}
          HEAD_SHA_PR: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA_REVIEW: ${{ github.event.review.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            echo "pr_number=${PR_NUMBER_PR:-$PR_NUMBER_REVIEW}" >> $GITHUB_OUTPUT
            echo "head_sha=${HEAD_SHA_PR:-$HEAD_SHA_REVIEW}" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            COMMENT_HEAD_SHA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER_COMMENT}" --jq '.head.sha')
            echo "pr_number=$PR_NUMBER_COMMENT" >> $GITHUB_OUTPUT
            echo "head_sha=$COMMENT_HEAD_SHA" >> $GITHUB_OUTPUT
          else
            echo "pr_number=$PR_NUMBER_PR" >> $GITHUB_OUTPUT
            echo "head_sha=$HEAD_SHA_PR" >> $GITHUB_OUTPUT
          fi
          echo "Resolved HEAD SHA: $(grep head_sha "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Check if sensitive AI configs or workflows changed
        id: check_sensitive_files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
        run: |
          SENSITIVE_FILES_UPDATED=false
          MODIFIED_FILES=""

          # Use the GitHub API instead of git diff so we don't need to check
          # out the repository. Extract both filename and previous_filename to
          # catch renames out of sensitive paths.
          CHANGED_FILES=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[] | .filename, (.previous_filename // empty)')

          for file in $SENSITIVE_FILES; do
            if echo "$CHANGED_FILES" | grep -q "^$file"; then
              echo "Sensitive file detected: $file"
              SENSITIVE_FILES_UPDATED=true
              MODIFIED_FILES="${MODIFIED_FILES}- \`${file}\`"$'\n'
            fi
          done

          echo "detected=${SENSITIVE_FILES_UPDATED}" >> $GITHUB_OUTPUT
          if [ "$SENSITIVE_FILES_UPDATED" = true ]; then
            echo "modified_files<<EOF" >> $GITHUB_OUTPUT
            echo "$MODIFIED_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # On review and comment events, the status was already set by the earlier
      # pull_request_target run. Skip to avoid 403 on fork PRs where the
      # GITHUB_TOKEN lacks statuses:write on the base repo.
      - name: Set status — no sensitive files changed
        if: steps.check_sensitive_files.outputs.detected != 'true' && github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="${STATUS_CONTEXT}" \
            -f description="No sensitive AI config files changed"

      - name: Post PR comment for sensitive files
        if: steps.check_sensitive_files.outputs.detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          MODIFIED_FILES_LIST: ${{ steps.check_sensitive_files.outputs.modified_files }}
        run: |
          COMMENT_BODY=$(printf "**AI Configuration Guard**\n\nThis PR modifies sensitive AI configuration files or workflows that require approval from a member of: **@%s**\n\nThe following sensitive files were detected:\n%s\nAn authorized team member can approve by leaving a standalone \`/lgtm\` or \`/approve\` comment on this PR, or by submitting an approving review." "${ALLOWED_APPROVER_TEAM}" "${MODIFIED_FILES_LIST}")
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" or .user.login == "github-actions") | select((.body // "") | startswith("**AI Configuration Guard**")) | .id' | sed -n '1p')
          if [ -z "$COMMENT_ID" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$COMMENT_BODY"
          elif [ "$(gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" --jq '.body')" != "$COMMENT_BODY" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" -X PATCH -f body="$COMMENT_BODY"
          else
            echo "Guard comment is current (ID: $COMMENT_ID)."
          fi

      # Generates "APP_TOKEN" to verify the approver belongs to the team of
      # approvers AND to write commit statuses. The GITHUB_TOKEN on
      # review and comment events lacks statuses:write for fork PRs, so the
      # App token is used for all status writes in the sensitive-files path.
      - name: Generate GitHub App token
        id: app-token
        if: steps.check_sensitive_files.outputs.detected == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check for team review or comment approval and set status
        if: steps.check_sensitive_files.outputs.detected == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::App token unavailable — cannot verify team membership."
            exit 1
          fi

          # App token is used for team membership, PR reviews and comments,
          # and commit status writes. This ensures fork PRs work (GITHUB_TOKEN
          # on review and comment events lacks statuses:write for forks).
          REVIEWS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate --jq '.[] | select(.state == "APPROVED") | .user.login')
          # Only a standalone command counts; text mentioning the command does not.
          COMMENT_APPROVERS=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select((.body // "") | test("^[[:space:]]*/(lgtm|approve)[[:space:]]*$"; "i")) | .user.login')

          ORG=$(echo "${ALLOWED_APPROVER_TEAM}" | cut -d'/' -f1)
          TEAM_SLUG=$(echo "${ALLOWED_APPROVER_TEAM}" | cut -d'/' -f2)
          TEAM_MEMBERS=$(gh api "/orgs/${ORG}/teams/${TEAM_SLUG}/members" --paginate -q '.[].login')

          APPROVED=false
          APPROVER=""
          while IFS= read -r approver; do
            [ -z "$approver" ] && continue
            if echo "$TEAM_MEMBERS" | grep -Fqix -- "$approver"; then
              APPROVED=true
              APPROVER="$approver"
              break
            fi
          done <<< "$REVIEWS"$'\n'"$COMMENT_APPROVERS"

          if [ "$APPROVED" = true ]; then
            echo "Approved by @$APPROVER (member of ${ALLOWED_APPROVER_TEAM})."
            gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state=success \
              -f context="${STATUS_CONTEXT}" \
              -f description="Approved by @${APPROVER}"
          else
            echo "No review or /lgtm or /approve comment from ${ALLOWED_APPROVER_TEAM} yet."
            gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state=failure \
              -f context="${STATUS_CONTEXT}" \
              -f description="Requires owner review or /lgtm or /approve comment"
          fi
