# Enforces ownership policy without GitHub's native code-owner review rule.
#
# This workflow is intentionally evaluated from the default branch via
# pull_request_target or workflow_run and never checks out or executes
# pull-request code. It reads changed paths, CODEOWNERS at the PR base SHA,
# reviews, and PR comments only through the GitHub API using the existing
# rhai-org-pulse GitHub App token.

name: Ownership Gate

on:
  pull_request_target:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
  issue_comment:
    types:
      - created
      - edited
      - deleted
  workflow_run:
    workflows: [Ownership Review Signal]
    types: [completed]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    if: github.event_name != 'merge_group' && (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
    name: Evaluate ownership
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Always use the trusted default-branch policy implementation. Do not
      # check out the pull request's head ref in this privileged workflow.
      - name: Check out trusted policy code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download review signal
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: ownership-review-signal
          path: signal
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve review signal
        if: github.event_name == 'workflow_run'
        id: review-signal
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="$(tr -d '\n' < signal/pr-number)"
          head_sha="$(tr -d '\n' < signal/head-sha)"
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]] ||
             [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "::error::Ownership review signal did not match workflow_run head"
            exit 1
          fi
          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Evaluate ownership policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || steps.review-signal.outputs.pr-number }}
          OWNERSHIP_GATE_BOT_LOGIN: rhai-org-pulse[bot]
        run: node scripts/ownership-gate.mjs

  merge-queue-status:
    if: github.event_name == 'merge_group'
    name: Evaluate merge queue ownership
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Re-evaluate every PR in the group against the group base SHA. This
      # prevents a policy change on main from being bypassed by an older
      # successful PR status.
      - name: Check out trusted policy code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Evaluate merge-queue ownership policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: node scripts/ownership-gate.mjs
