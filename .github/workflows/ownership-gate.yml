# Enforces ownership policy without GitHub's native code-owner review rule.
#
# This workflow is intentionally evaluated from the default branch via
# pull_request_target and never checks out or executes pull-request code. It
# reads changed paths, CODEOWNERS at the PR base SHA, and review metadata only
# through the GitHub API using the existing rhai-org-pulse GitHub App token.

name: Ownership Gate

on:
  pull_request_target:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
  pull_request_review:
    branches: [main]
    types:
      - submitted
      - dismissed
      - edited
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  evaluate:
    if: github.event_name != 'merge_group'
    name: Evaluate ownership
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Always use the trusted default-branch policy implementation. Do not
      # check out the pull request's head ref in this privileged workflow.
      - name: Check out trusted policy code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Evaluate ownership policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNERSHIP_GATE_BOT_LOGIN: rhai-org-pulse[bot]
        run: node scripts/ownership-gate.mjs

  merge-queue-status:
    if: github.event_name == 'merge_group'
    name: Publish merge-queue status
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # A PR must pass Ownership Gate before it can enter the queue. Publish
      # the same required App-owned status on the merge group's synthetic SHA.
      - name: Set Ownership Gate status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          REPO: ${{ github.repository }}
          STATUS_CONTEXT: Ownership Gate
        run: |
          gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="${STATUS_CONTEXT}" \
            -f description='Merge queue — verified on pull request' \
            -f target_url="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
